# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # GitHub Pages enforces a 1 GB limit on the published site. The repository
      # is ~3.1 GB, which caused deployments to fail with a 503 at the deploy step.
      # These groups are never served from Pages, so they are pruned from the
      # checkout before upload. Nothing is removed from the repository itself.
      #   - GLB models      : TrueVision loads these from cdn.noble-architecture.com (R2)
      #   - CAD audit cache : local working cache for the desktop CadAuditTools app
      #   - Archive zips    : superseded app versions and dev asset bundles
      #   - .claude         : Claude skills and settings (~260 MB), never part of the site
      #   - App archives    : na-apps/00__Archive and 70__ProductionTools/00__Archive (old app versions)
      #   - Quarantine      : na-project-portal/00__Deleted__Quarantine (deleted projects, not public)
      # Project 00__Archive folders stay: PlanVision can show archived documents to clients.
      - name: Prune assets not served from Pages
        run: |
          echo "Size before prune: $(du -sh . | cut -f1)"
          find . -path ./.git -prune -o -type f -name '*.glb' -print -delete | wc -l | xargs echo "  GLB removed:"
          rm -rf ./na-apps/70__ProductionTools/Noble__CadAuditTools/04__LocalProjectCache
          find . -path ./.git -prune -o -type f -name '*.zip' -print -delete | wc -l | xargs echo "  ZIP removed:"
          rm -rf ./.claude ./na-apps/00__Archive ./na-apps/70__ProductionTools/00__Archive ./na-project-portal/00__Deleted__Quarantine
          echo "Size after prune:  $(du -sh . | cut -f1)"

      # Publish pinned third-party inference binaries without committing them
      # to the source repository. The deployed site then serves them locally.
      - name: Publish Text To Reader Phonon runtime
        shell: bash
        run: |
          set -euo pipefail
          APP="na-apps/80__MiniApps/06__MiniApps__TextToSpeach"
          RUNTIME="$APP/02__PhononRuntime"
          mkdir -p "$RUNTIME"
          npm pack phonon-tts@0.4.0 --pack-destination /tmp --silent
          tar -xzf /tmp/phonon-tts-0.4.0.tgz -C "$RUNTIME" --strip-components=1
          mkdir -p /tmp/na-reader-marked
          npm pack marked@15.0.12 --pack-destination /tmp --silent
          tar -xzf /tmp/marked-15.0.12.tgz -C /tmp/na-reader-marked --strip-components=1
          cp /tmp/na-reader-marked/lib/marked.esm.js "$RUNTIME/marked.esm.js"
          test -s "$RUNTIME/index.js"
          test -s "$RUNTIME/worker.js"
          test -s "$RUNTIME/wasm/phonon_tts_bg.wasm"
          test -s "$RUNTIME/wasm-threads/phonon_tts_bg.wasm"
          test -s "$RUNTIME/marked.esm.js"
          echo "Published Phonon 0.4.0 and Marked 15.0.12."

      # Kokoro 82M runs through kokoro-js, whose web bundle loads ONNX Runtime's
      # threaded wasm from beside it (same-origin, so its thread workers start).
      # The model and voices themselves are served from cdn.noble-architecture.com.
      - name: Publish Text To Reader Kokoro runtime
        shell: bash
        run: |
          set -euo pipefail
          APP="na-apps/80__MiniApps/06__MiniApps__TextToSpeach"
          RUNTIME="$APP/03__KokoroRuntime"
          mkdir -p "$RUNTIME" /tmp/na-reader-kokoro /tmp/na-reader-transformers
          npm pack kokoro-js@1.2.1 --pack-destination /tmp --silent
          tar -xzf /tmp/kokoro-js-1.2.1.tgz -C /tmp/na-reader-kokoro --strip-components=1
          npm pack @huggingface/transformers@3.5.1 --pack-destination /tmp --silent
          tar -xzf /tmp/huggingface-transformers-3.5.1.tgz -C /tmp/na-reader-transformers --strip-components=1
          cp /tmp/na-reader-kokoro/dist/kokoro.web.js "$RUNTIME/kokoro.web.js"
          cp /tmp/na-reader-transformers/dist/ort-wasm-simd-threaded.jsep.mjs "$RUNTIME/"
          cp /tmp/na-reader-transformers/dist/ort-wasm-simd-threaded.jsep.wasm "$RUNTIME/"
          test -s "$RUNTIME/kokoro.web.js"
          test -s "$RUNTIME/ort-wasm-simd-threaded.jsep.mjs"
          test -s "$RUNTIME/ort-wasm-simd-threaded.jsep.wasm"
          echo "Published kokoro-js 1.2.1 with ONNX Runtime from transformers 3.5.1."

      # The artifact is named per attempt. "Re-run jobs" keeps the run's earlier uploads, and
      # deploy-pages refuses a run holding two artifacts of the same name ("Multiple artifacts
      # named github-pages"), so a re-run of a failed deploy could never succeed (run #728).
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload the pruned repository
          path: '.'
          name: github-pages-${{ github.run_attempt }}

      # The site is ~3.8 GB, well over Pages' stated 1 GB, and GitHub can take longer than the
      # default 10 minutes to accept it ("Timeout reached, aborting!", 09-Nov-2026): 30 minutes.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
          timeout: 1800000
