# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # GitHub Pages enforces a 1 GB limit on the published site. The repository
      # is ~3.1 GB, which caused deployments to fail with a 503 at the deploy step.
      # These three groups are never served from Pages, so they are pruned from the
      # checkout before upload. Nothing is removed from the repository itself.
      #   - GLB models      : TrueVision loads these from cdn.noble-architecture.com (R2)
      #   - CAD audit cache : local working cache for the desktop CadAuditTools app
      #   - Archive zips    : superseded app versions and dev asset bundles
      - name: Prune assets not served from Pages
        run: |
          echo "Size before prune: $(du -sh . | cut -f1)"
          find . -path ./.git -prune -o -type f -name '*.glb' -print -delete | wc -l | xargs echo "  GLB removed:"
          rm -rf ./na-apps/70__ProductionTools/Noble__CadAuditTools/04__LocalProjectCache
          find . -path ./.git -prune -o -type f -name '*.zip' -print -delete | wc -l | xargs echo "  ZIP removed:"
          echo "Size after prune:  $(du -sh . | cut -f1)"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload the pruned repository
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
