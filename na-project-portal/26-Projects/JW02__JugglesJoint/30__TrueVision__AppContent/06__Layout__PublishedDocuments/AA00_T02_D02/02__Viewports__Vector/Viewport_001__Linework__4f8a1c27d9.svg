    <!--
      PUBLISHED LINEWORK - DUMMY EXAMPLE, hand-drawn to show the shape.

      This is the whole vector half of a viewport: one <path> per line class,
      paint order heavy first and dashed last, with stroke colour, width,
      opacity and dash ALREADY RESOLVED onto the element.

      The real file is the same five paths with the real 'd' data - about
      180 KB of text for an elevation of 18,842 segments, and five DOM nodes
      however many segments there are.

      COORDINATES are paper millimetres inside the viewport's own frame, so
      the reader positions the whole thing with one translate to
      Viewport__FrameMm and scales it with one transform when the sheet zooms.
      Nothing is re-rasterised on zoom, because nothing was ever a raster.

      STROKE WIDTHS are the configured drawing-millimetre widths divided by the
      viewport's scale denominator: a visible edge is 12 drawing mm, which at
      1:100 is 0.12 paper mm. The division happens HERE, at publish, so the
      reader holds no appearance config and no scale arithmetic.

      WHAT IS NOT HERE, deliberately: the segment coordinate arrays, the owner
      tag runs, the model build token, the view fingerprint and the class
      appearance rules. Publishing those would mean the reader has to own the
      styling half of the projection module to turn them into lines - and a
      reader that can style linework is a reader that can be asked to compute
      it.
    -->

