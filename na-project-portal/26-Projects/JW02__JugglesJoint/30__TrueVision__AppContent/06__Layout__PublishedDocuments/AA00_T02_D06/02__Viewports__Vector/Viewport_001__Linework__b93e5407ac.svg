    <!--
      PUBLISHED LINEWORK - DUMMY EXAMPLE, hand-drawn to show the shape.

      A plan at 1:50, so the configured drawing-millimetre widths are divided
      by 50 rather than 100: a visible edge of 12 drawing mm is 0.24 paper mm
      here against 0.12 on the 1:100 elevation. The reader does no such
      arithmetic - it is done once, here, at publish.

      The real file is 41,206 segments and about 400 KB of path text, and
      STILL FIVE DOM NODES. That is the property that makes vector linework
      safe on a phone: the cost of an SVG to the browser is the number of
      elements far more than the length of a path.

      The section class carries the cut - the walls this plan slices through -
      at 28 drawing mm, which is 0.56 paper mm at 1:50.
    -->

    <g data-na-class="section" fill="none" stroke="#505050" stroke-width="0.56" stroke-opacity="1" stroke-linecap="round" stroke-linejoin="round">
