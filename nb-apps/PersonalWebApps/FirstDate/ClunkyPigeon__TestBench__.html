<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clunky Pigeon — Test Bench</title>

<!--
  ===========================================================================
  CLUNKY PIGEON  ·  ISOLATED TEST BENCH
  ---------------------------------------------------------------------------
  Self-contained. No build step, no dependencies, no network.
  Open it straight off disk (double click) or serve it with
  run_server_from_root.py and hit the same path.

  The canonical asset is   assets/Animation__ClunkyPigeon__.svg
  This page keeps an inline copy so it still works from a file:// URL where
  fetch() is blocked. When the page IS served over http it re-fetches the real
  .svg on load and on "Reload from file", so you can edit the asset and just
  refresh to see the change. The banner at the top tells you which copy is live.
  ===========================================================================
-->

<style>
  :root{
    --ink:#9f1239;
    --page:#15181d;
    --panel:#1e232b;
    --panel-2:#272e38;
    --edge:#333c48;
    --text:#e7ecf3;
    --text-dim:#97a3b4;
    --ui:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--page);color:var(--text);font:14px/1.5 var(--ui);
       display:grid;grid-template-rows:auto 1fr;overflow:hidden}
  @media (max-width:900px){body{overflow:auto;height:auto}}

  /* ---- top bar -------------------------------------------------------- */
  .bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;
       padding:12px 18px;border-bottom:1px solid var(--edge);background:var(--panel)}
  .bar h1{font-size:15px;font-weight:600;margin:0;letter-spacing:.2px}
  .bar h1 span{color:var(--text-dim);font-weight:400}
  .src{font:11px/1 var(--mono);padding:5px 9px;border-radius:5px;
       background:var(--panel-2);color:var(--text-dim);border:1px solid var(--edge)}
  .src[data-live="file"]{color:#7ee0a8;border-color:#2f5c42}
  .bar .spacer{flex:1}

  /* ---- layout --------------------------------------------------------- */
  .main{display:grid;grid-template-columns:1fr 320px;min-height:0}
  @media (max-width:900px){.main{grid-template-columns:1fr}}

  .stageWrap{display:grid;grid-template-rows:1fr auto;min-height:0;min-width:0}
  .stage{display:grid;place-items:center;padding:28px;min-height:0;overflow:auto;position:relative}
  .stage.bg-white  {background:#ffffff}
  .stage.bg-rose   {background:#fff1f2}
  .stage.bg-paper  {background:#f7fafc}
  .stage.bg-dark   {background:#241016}
  .stage.bg-grid   {background:#ffffff;
    background-image:linear-gradient(#0000000f 1px,transparent 1px),linear-gradient(90deg,#0000000f 1px,transparent 1px);
    background-size:16px 16px}

  #holder{position:relative;line-height:0}
  #holder svg{display:block;width:100%;height:auto}

  /* pivot crosshairs, drawn over the stage not inside the SVG */
  .pivots{position:absolute;inset:0;pointer-events:none;display:none}
  .pivots.on{display:block}
  .pivots i{position:absolute;width:13px;height:13px;margin:-7px 0 0 -7px;
            border-radius:50%;border:1.5px solid #00b4ff;background:#00b4ff22}
  .pivots i::after{content:attr(data-l);position:absolute;left:16px;top:-3px;
            font:10px/1 var(--mono);color:#00b4ff;white-space:nowrap}

  /* size ladder */
  .ladder{display:flex;align-items:flex-end;gap:22px;justify-content:center;flex-wrap:wrap;
          padding:16px 18px;border-top:1px solid var(--edge);background:#fff}
  .ladder figure{margin:0;text-align:center}
  .ladder img{display:block}
  .ladder figcaption{font:10px/1.6 var(--mono);color:#8b96a5;margin-top:5px}

  /* ---- controls ------------------------------------------------------- */
  .panel{border-left:1px solid var(--edge);background:var(--panel);
         overflow-y:auto;padding:16px 16px 40px}
  @media (max-width:900px){.panel{border-left:0;border-top:1px solid var(--edge)}}
  .grp{margin-bottom:22px}
  .grp > h2{font-size:10px;letter-spacing:.14em;text-transform:uppercase;
            color:var(--text-dim);margin:0 0 10px;font-weight:600}

  .row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:9px}
  button{font:500 12px var(--ui);color:var(--text);background:var(--panel-2);
         border:1px solid var(--edge);border-radius:6px;padding:7px 11px;cursor:pointer}
  button:hover{background:#30394599}
  button:active{transform:translateY(1px)}
  button.on{background:var(--ink);border-color:var(--ink);color:#fff}
  button:focus-visible{outline:2px solid #00b4ff;outline-offset:2px}

  label.slider{display:block;margin-bottom:12px}
  label.slider .lbl{display:flex;justify-content:space-between;font-size:12px;
                    color:var(--text-dim);margin-bottom:5px}
  label.slider .lbl b{color:var(--text);font:500 12px var(--mono)}
  input[type=range]{width:100%;accent-color:var(--ink)}
  input[type=range]:focus-visible{outline:2px solid #00b4ff;outline-offset:3px}

  .toggles{display:grid;grid-template-columns:1fr 1fr;gap:7px}
  .toggles button{text-align:left;padding:7px 9px}

  .readout{font:11px/1.7 var(--mono);color:var(--text-dim);
           background:#161a20;border:1px solid var(--edge);border-radius:6px;padding:10px 11px}
  .readout b{color:var(--text);font-weight:500}
  .hint{font-size:11px;color:var(--text-dim);line-height:1.6;margin:8px 0 0}
  .hint code{font:11px var(--mono);color:#c8b3ba}
</style>
</head>
<body>

<div class="bar">
  <h1>Clunky Pigeon <span>· test bench</span></h1>
  <span class="src" id="srcTag" data-live="inline">source: inline copy</span>
  <div class="spacer"></div>
  <button id="reload">Reload from file</button>
</div>

<div class="main">

  <div class="stageWrap">
    <div class="stage bg-white" id="stage">
      <div id="holder"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 344 254" width="344" height="254" role="img" aria-label="A clunky wind-up robot pigeon with a flapping plated wing and a letter in its beak">
  <title>Clunky Pigeon</title>
  <style>
    .cp-ink{fill:none;stroke:var(--pictogram-ink,#9f1239);stroke-width:5.5;stroke-linecap:round;stroke-linejoin:round}
    .cp-sol{fill:var(--pictogram-ink,#9f1239);stroke:none}

    .cp-rig  {animation:cp-bob 1.05s steps(3,end) infinite}
    .cp-wing {animation:cp-flap .46s steps(3,end) infinite alternate;transform-origin:152px 118px}
    .cp-key  {animation:cp-spinrev 1.9s steps(6,end) infinite;transform-origin:110px 106px}
    .cp-bulb {animation:cp-blink 1.1s steps(1,end) infinite}
    .cp-zap  {animation:cp-zap 1.1s steps(1,end) infinite}
    .cp-iris {animation:cp-look 3.4s steps(1,end) infinite}
    .cp-bolt {animation:cp-drop 3.2s linear infinite;transform-box:fill-box;transform-origin:center}
    .cp-env  {animation:cp-swing 2.4s ease-in-out infinite;transform-origin:262px 68px}
    .cp-seal {animation:cp-seal 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}

    @keyframes cp-bob     {0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
    @keyframes cp-flap    {from{transform:rotate(-7deg)}to{transform:rotate(25deg)}}
    @keyframes cp-spinrev {to{transform:rotate(-360deg)}}
    @keyframes cp-blink   {0%,45%{opacity:1}50%,100%{opacity:.18}}
    @keyframes cp-zap     {0%,45%{opacity:0}50%,100%{opacity:1}}
    @keyframes cp-look    {0%,40%{transform:translateX(0)}50%,92%{transform:translateX(5px)}100%{transform:translateX(0)}}
    @keyframes cp-swing   {0%,100%{transform:rotate(-4deg)}50%{transform:rotate(6deg)}}
    @keyframes cp-seal    {0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
    @keyframes cp-drop    {0%,38%{opacity:0;transform:translateY(0) rotate(0)}41%{opacity:1}88%,100%{opacity:0;transform:translateY(28px) rotate(260deg)}}

    @media (prefers-reduced-motion:reduce){
      .cp-rig,.cp-wing,.cp-key,.cp-bulb,.cp-zap,.cp-iris,.cp-bolt,.cp-env,.cp-seal{animation:none}
    }
  </style>

  <g class="cp-rig">
    <g class="cp-ink">
      <!-- tail plates -->
      <path d="M76 150 L24 142 C17 141 17 193 24 192 L78 184"/>
      <path d="M27 158 L76 160"/>
      <path d="M27 177 L77 173"/>
      <!-- chassis -->
      <path d="M68 156 C68 118 100 94 142 94 C184 94 208 122 206 154 C204 186 176 204 138 202 C100 200 68 192 68 156 Z"/>
      <!-- legs -->
      <path d="M126 201 L126 222"/>
      <path d="M126 222 L115 231"/>
      <path d="M126 222 L126 233"/>
      <path d="M126 222 L137 231"/>
      <path d="M160 202 L160 223"/>
      <path d="M160 223 L149 232"/>
      <path d="M160 223 L160 234"/>
      <path d="M160 223 L171 232"/>
      <!-- neck struts -->
      <path d="M192 94 L192 101"/>
      <path d="M208 94 L208 100"/>
      <!-- head -->
      <rect x="170" y="38" width="58" height="56" rx="18"/>
      <path d="M176 62 L176 78"/>
      <path d="M183 64 L183 76"/>
      <!-- beak -->
      <path d="M226 56 L262 68 L226 80"/>
      <path d="M228 68 L256 68"/>
      <!-- eye -->
      <circle cx="198" cy="64" r="11"/>
      <!-- aerial -->
      <path d="M196 38 L196 29"/>
      <circle class="cp-bulb" cx="196" cy="22" r="7"/>
      <g class="cp-zap">
        <path d="M186 14 L183 11"/>
        <path d="M196 10 L196 6"/>
        <path d="M206 14 L209 11"/>
      </g>
      <!-- wind-up key -->
      <g class="cp-key">
        <path d="M110 106 L110 84"/>
        <circle cx="101" cy="76" r="9"/>
        <circle cx="119" cy="76" r="9"/>
      </g>
      <!-- wing -->
      <g class="cp-wing">
        <path d="M156 114 C128 110 100 122 82 142 C74 151 78 162 90 162 C100 156 106 162 114 158 C122 152 128 158 136 152 C144 146 150 134 156 114 Z"/>
        <path d="M112 130 C114 142 112 152 108 159"/>
        <path d="M134 124 C136 136 134 146 130 153"/>
        <circle cx="150" cy="120" r="6"/>
      </g>
      <!-- bolt socket, and the bolt working loose -->
      <circle cx="142" cy="201" r="4"/>
      <g class="cp-bolt">
        <circle cx="142" cy="213" r="6"/>
        <path d="M137.5 213 L146.5 213"/>
      </g>
    </g>
    <g class="cp-sol">
      <circle class="cp-iris" cx="198" cy="64" r="4.5"/>
      <circle cx="124" cy="100" r="3.5"/>
      <circle cx="198" cy="124" r="3.5"/>
      <circle cx="112" cy="188" r="3.5"/>
      <circle cx="180" cy="48" r="3.5"/>
      <circle cx="180" cy="90" r="3.5"/>
    </g>

    <!-- the letter -->
    <g class="cp-env">
      <g transform="translate(258 62) rotate(12)" class="cp-ink">
        <rect x="0" y="0" width="76" height="52" rx="8"/>
        <path d="M3 5 L38 30 L73 5"/>
        <path class="cp-seal" d="M38 39 C32.5 35.2 28 32 28 28.2 C28 25 30.8 23.4 33.5 25 C35.1 25.9 36.9 27.2 38 28.6 C39.1 27.2 40.9 25.9 42.5 25 C45.2 23.4 48 25 48 28.2 C48 32 43.5 35.2 38 39 Z" fill="var(--pictogram-ink,#9f1239)" stroke="none"/>
      </g>
    </g>
  </g>
</svg></div>
      <div class="pivots" id="pivots">
        <i data-l="wing hinge 152,118" data-x="152" data-y="118"></i>
        <i data-l="key base 110,106" data-x="110" data-y="106"></i>
        <i data-l="beak grip 262,68"   data-x="262" data-y="68"></i>
      </div>
    </div>
    <div class="ladder" id="ladder"></div>
  </div>

  <div class="panel">

    <div class="grp">
      <h2>Transport</h2>
      <div class="row">
        <button id="play" class="on">Pause</button>
        <button id="restart">Restart</button>
        <button data-step="-50">&minus;50ms</button>
        <button data-step="50">+50ms</button>
      </div>
      <label class="slider">
        <span class="lbl">Speed <b id="speedV">1.00&times;</b></span>
        <input type="range" id="speed" min="5" max="200" value="100">
      </label>
      <label class="slider">
        <span class="lbl">Scrub <b id="scrubV">0.00s</b></span>
        <input type="range" id="scrub" min="0" max="3200" value="0">
      </label>
      <div class="readout" id="readout">paused at 0.00s</div>
    </div>

    <div class="grp">
      <h2>Moving parts</h2>
      <div class="toggles" id="toggles"></div>
      <p class="hint">Turning one off freezes it at its resting pose, so you can
        judge each bit on its own.</p>
    </div>

    <div class="grp">
      <h2>Stage</h2>
      <div class="row" id="bgs">
        <button data-bg="bg-white" class="on">White</button>
        <button data-bg="bg-rose">Rose 50</button>
        <button data-bg="bg-paper">Site grey</button>
        <button data-bg="bg-dark">Dark</button>
        <button data-bg="bg-grid">Grid</button>
      </div>
      <label class="slider">
        <span class="lbl">Preview width <b id="sizeV">420px</b></span>
        <input type="range" id="size" min="120" max="680" value="420">
      </label>
      <div class="row">
        <button id="pivotBtn">Show pivots</button>
        <button id="inkBtn">Swap ink</button>
      </div>
      <p class="hint">Swap ink re-points <code>--pictogram-ink</code> to check the
        artwork is not hard-wired to the crimson.</p>
    </div>

  </div>
</div>

<script>
(() => {
  "use strict";

  const holder   = document.getElementById("holder");
  const stage    = document.getElementById("stage");
  const srcTag   = document.getElementById("srcTag");
  const readout  = document.getElementById("readout");
  const scrub    = document.getElementById("scrub");
  const scrubV   = document.getElementById("scrubV");
  const speed    = document.getElementById("speed");
  const speedV   = document.getElementById("speedV");
  const playBtn  = document.getElementById("play");
  const pivots   = document.getElementById("pivots");

  /* The named moving parts. Key is the class on the SVG group. */
  const PARTS = [
    ["cp-rig",  "Body bob"],
    ["cp-wing", "Wing flap"],
    ["cp-key",  "Wind-up key"],
    ["cp-bolt", "Dropping bolt"],
    ["cp-env",  "Letter swing"],
    ["cp-seal", "Wax seal"],
    ["cp-iris", "Eye glance"],
    ["cp-bulb", "Aerial lamp"]
  ];
  const off = new Set();          /* parts the user has switched off */
  let playing = true;
  let longest = 3200;             /* ms — recomputed from the real animations */

  /* ---- animation handles ---------------------------------------------- */
  const svgEl   = () => holder.querySelector("svg");
  const anims   = () => (svgEl() ? svgEl().getAnimations({ subtree: true }) : []);

  function partOf(anim) {
    const el = anim.effect && anim.effect.target;
    if (!el || !el.classList) return null;
    for (const [cls] of PARTS) if (el.classList.contains(cls)) return cls;
    return null;
  }

  function measure() {
    let max = 0;
    for (const a of anims()) {
      const t = a.effect.getComputedTiming();
      const d = (t.duration || 0) + (t.delay || 0);
      if (d > max) max = d;
    }
    /* one full turn of the slowest loop, rounded up to a tidy number */
    longest = Math.max(1000, Math.ceil(max / 100) * 100) || 3200;
    scrub.max = String(longest);
  }

  function applyAll() {
    const rate = Number(speed.value) / 100;
    for (const a of anims()) {
      const p = partOf(a);
      const muted = p && off.has(p);
      a.playbackRate = rate;
      if (muted) { a.currentTime = 0; a.pause(); }
      else if (playing) a.play();
      else a.pause();
    }
    paint();
  }

  function seek(ms) {
    for (const a of anims()) {
      const p = partOf(a);
      if (p && off.has(p)) continue;
      a.currentTime = ms;
    }
    paint();
  }

  function paint() {
    const live = anims().find(a => { const p = partOf(a); return !(p && off.has(p)); });
    const t = live ? (live.currentTime || 0) : 0;
    scrubV.textContent = (t / 1000).toFixed(2) + "s";
    if (playing) scrub.value = String(Math.round(t % longest));
    readout.textContent = (playing ? "running" : "paused") + " at "
      + (t / 1000).toFixed(2) + "s · " + (Number(speed.value) / 100).toFixed(2) + "\u00d7 · "
      + anims().length + " animations · " + (off.size ? off.size + " muted" : "all on");
  }

  /* ---- controls -------------------------------------------------------- */
  playBtn.addEventListener("click", () => {
    playing = !playing;
    playBtn.textContent = playing ? "Pause" : "Play";
    playBtn.classList.toggle("on", playing);
    applyAll();
  });

  document.getElementById("restart").addEventListener("click", () => seek(0));

  for (const b of document.querySelectorAll("[data-step]")) {
    b.addEventListener("click", () => {
      if (playing) playBtn.click();
      const live = anims()[0];
      const now = live ? (live.currentTime || 0) : 0;
      seek(Math.max(0, now + Number(b.dataset.step)));
    });
  }

  speed.addEventListener("input", () => {
    speedV.textContent = (Number(speed.value) / 100).toFixed(2) + "\u00d7";
    applyAll();
  });

  scrub.addEventListener("input", () => {
    if (playing) playBtn.click();
    seek(Number(scrub.value));
  });

  /* moving-part toggles */
  const tg = document.getElementById("toggles");
  for (const [cls, label] of PARTS) {
    const b = document.createElement("button");
    b.textContent = label;
    b.className = "on";
    b.addEventListener("click", () => {
      if (off.has(cls)) off.delete(cls); else off.add(cls);
      b.classList.toggle("on", !off.has(cls));
      applyAll();
    });
    tg.appendChild(b);
  }

  /* stage background */
  document.getElementById("bgs").addEventListener("click", e => {
    const b = e.target.closest("button[data-bg]");
    if (!b) return;
    stage.className = "stage " + b.dataset.bg;
    for (const o of document.querySelectorAll("#bgs button")) o.classList.toggle("on", o === b);
  });

  /* preview size */
  const size = document.getElementById("size");
  const sizeV = document.getElementById("sizeV");
  function sizeIt() {
    holder.style.width = size.value + "px";
    sizeV.textContent = size.value + "px";
    placePivots();
  }
  size.addEventListener("input", sizeIt);

  /* pivot crosshairs, mapped from viewBox units to screen */
  const pivotBtn = document.getElementById("pivotBtn");
  pivotBtn.addEventListener("click", () => {
    pivots.classList.toggle("on");
    pivotBtn.classList.toggle("on", pivots.classList.contains("on"));
    placePivots();
  });
  function placePivots() {
    const svg = svgEl(); if (!svg) return;
    const vb = svg.viewBox.baseVal;
    const r = svg.getBoundingClientRect();
    const s = stage.getBoundingClientRect();
    if (!vb.width || !r.width) return;
    const k = r.width / vb.width;
    for (const i of pivots.querySelectorAll("i")) {
      i.style.left = (r.left - s.left + (Number(i.dataset.x) - vb.x) * k) + "px";
      i.style.top  = (r.top  - s.top  + (Number(i.dataset.y) - vb.y) * k) + "px";
    }
  }
  addEventListener("resize", placePivots);

  /* ink swap */
  const INKS = ["#9f1239", "#0f172a", "#0d9488", "#b45309"];
  let inkAt = 0;
  document.getElementById("inkBtn").addEventListener("click", () => {
    inkAt = (inkAt + 1) % INKS.length;
    holder.style.setProperty("--pictogram-ink", INKS[inkAt]);
    document.getElementById("inkBtn").classList.toggle("on", inkAt !== 0);
  });

  /* size ladder — the same file at the sizes it will actually be used at */
  function buildLadder() {
    const svg = svgEl(); if (!svg) return;
    const data = "data:image/svg+xml;base64," + btoa(unescape(encodeURIComponent(svg.outerHTML)));
    const lad = document.getElementById("ladder");
    lad.textContent = "";
    for (const w of [64, 110, 180, 280]) {
      const f = document.createElement("figure");
      const img = new Image();
      img.src = data; img.width = w; img.alt = "";
      const cap = document.createElement("figcaption");
      cap.textContent = w + "px";
      f.append(img, cap); lad.appendChild(f);
    }
  }

  /* ---- boot ------------------------------------------------------------ */
  function wire() {
    measure(); sizeIt(); applyAll(); buildLadder();
  }

  /* When served over http, take the real asset so edits show on refresh. */
  async function fromFile() {
    try {
      const res = await fetch("assets/Animation__ClunkyPigeon__.svg", { cache: "no-store" });
      if (!res.ok) throw new Error(res.status);
      const txt = await res.text();
      const doc = new DOMParser().parseFromString(txt, "image/svg+xml");
      const svg = doc.querySelector("svg");
      if (!svg || doc.querySelector("parsererror")) throw new Error("not parseable");
      holder.replaceChildren(document.importNode(svg, true));
      srcTag.textContent = "source: assets/Animation__ClunkyPigeon__.svg";
      srcTag.dataset.live = "file";
      wire();
      return true;
    } catch (err) {
      srcTag.textContent = "source: inline copy (serve over http to live-load)";
      srcTag.dataset.live = "inline";
      return false;
    }
  }

  document.getElementById("reload").addEventListener("click", fromFile);

  wire();
  fromFile();
  requestAnimationFrame(function tick() { if (playing) paint(); requestAnimationFrame(tick); });
})();
</script>
</body>
</html>
