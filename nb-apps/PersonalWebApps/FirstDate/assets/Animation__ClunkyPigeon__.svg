<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 260" width="340" height="260" role="img" aria-label="ClunkyPigeon.com: a clockwork robot pigeon flapping along with a love letter in its beak">
  <title>Clunky Pigeon</title>
  <!--
    CLUNKY PIGEON - Clive's message-delivery assistant (ClunkyPigeon.com)
    One 4 s loop, pure CSS inside the file, so it runs from a plain <img> tag.
      0.0-2.4 s  steady flight: six flaps, the wind-up key turning with each one
      2.4-2.8 s  the clockwork stalls: wing jams up, key stops, lamp flickers,
                 it drops nose-down and looks down in alarm
      2.8-4.0 s  five frantic flaps with the key racing, back to cruising height
    Ink and paper are re-pointable with the CSS custom properties
    pictogram-ink (the lines) and pictogram-paper (the white behind the lines,
    so the wing hides whatever is behind it).
    Deliberately NO prefers-reduced-motion branch: the studio PC reports
    "reduce" (Windows animation effects off), which silently froze the old file.
    Pivots live on wrapper groups (translate), so every animated group turns
    about its own 0,0.
  -->
  <style>
    .cp-ink{fill:none;stroke:var(--pictogram-ink,#9f1239);stroke-width:5.5;stroke-linecap:round;stroke-linejoin:round}
    .cp-pap{fill:var(--pictogram-paper,#ffffff);stroke:var(--pictogram-ink,#9f1239);stroke-width:5.5;stroke-linecap:round;stroke-linejoin:round}
    .cp-sol{fill:var(--pictogram-ink,#9f1239);stroke:none}

    .cp-fly,.cp-wing,.cp-tail,.cp-legs,.cp-key,.cp-head,.cp-letter,.cp-iris,.cp-lamp{
      animation-duration:4s;animation-iteration-count:infinite;animation-timing-function:ease-in-out;transform-origin:0 0}
    .cp-fly    {animation-name:cp-fly}
    .cp-wing   {animation-name:cp-flap}
    .cp-tail   {animation-name:cp-tail}
    .cp-legs   {animation-name:cp-legs}
    .cp-key    {animation-name:cp-key;animation-timing-function:linear}
    .cp-head   {animation-name:cp-head}
    .cp-letter {animation-name:cp-letter}
    .cp-iris   {animation-name:cp-iris}
    .cp-lamp   {animation-name:cp-lamp;animation-timing-function:steps(1,end)}

    @keyframes cp-flap{
      0%{transform:rotate(38deg)}
      5%{transform:rotate(-12deg)}
      10%{transform:rotate(38deg)}
      15%{transform:rotate(-12deg)}
      20%{transform:rotate(38deg)}
      25%{transform:rotate(-12deg)}
      30%{transform:rotate(38deg)}
      35%{transform:rotate(-12deg)}
      40%{transform:rotate(38deg)}
      45%{transform:rotate(-12deg)}
      50%{transform:rotate(38deg)}
      55%{transform:rotate(-12deg)}
      60%{transform:rotate(38deg)}
      62.5%{transform:rotate(46deg)}
      64.5%{transform:rotate(41deg)}
      66.5%{transform:rotate(46deg)}
      70%{transform:rotate(44deg)}
      73%{transform:rotate(-14deg)}
      76%{transform:rotate(42deg)}
      79%{transform:rotate(-14deg)}
      82%{transform:rotate(42deg)}
      85%{transform:rotate(-14deg)}
      88%{transform:rotate(42deg)}
      91%{transform:rotate(-14deg)}
      94%{transform:rotate(42deg)}
      97%{transform:rotate(-14deg)}
      100%{transform:rotate(38deg)}
    }
    @keyframes cp-fly{
      0%{transform:translateY(2px) rotate(0deg)}
      5%{transform:translateY(-4px) rotate(0deg)}
      10%{transform:translateY(2px) rotate(0deg)}
      15%{transform:translateY(-4px) rotate(0deg)}
      20%{transform:translateY(2px) rotate(0deg)}
      25%{transform:translateY(-4px) rotate(0deg)}
      30%{transform:translateY(2px) rotate(0deg)}
      35%{transform:translateY(-4px) rotate(0deg)}
      40%{transform:translateY(2px) rotate(0deg)}
      45%{transform:translateY(-4px) rotate(0deg)}
      50%{transform:translateY(2px) rotate(0deg)}
      55%{transform:translateY(-4px) rotate(0deg)}
      60%{transform:translateY(2px) rotate(0deg)}
      64%{transform:translateY(6px) rotate(2deg)}
      70%{transform:translateY(20px) rotate(9deg)}
      73%{transform:translateY(19px) rotate(8deg)}
      76%{transform:translateY(16px) rotate(6deg)}
      79%{transform:translateY(13px) rotate(5deg)}
      82%{transform:translateY(10px) rotate(3deg)}
      85%{transform:translateY(7px) rotate(1deg)}
      88%{transform:translateY(5px) rotate(0deg)}
      91%{transform:translateY(1px) rotate(-2deg)}
      94%{transform:translateY(2px) rotate(-1deg)}
      97%{transform:translateY(-3px) rotate(0deg)}
      100%{transform:translateY(2px) rotate(0deg)}
    }
    @keyframes cp-tail{
      0%{transform:rotate(0deg)}
      5%{transform:rotate(5deg)}
      10%{transform:rotate(0deg)}
      15%{transform:rotate(5deg)}
      20%{transform:rotate(0deg)}
      25%{transform:rotate(5deg)}
      30%{transform:rotate(0deg)}
      35%{transform:rotate(5deg)}
      40%{transform:rotate(0deg)}
      45%{transform:rotate(5deg)}
      50%{transform:rotate(0deg)}
      55%{transform:rotate(5deg)}
      60%{transform:rotate(0deg)}
      66%{transform:rotate(10deg)}
      70%{transform:rotate(16deg)}
      76%{transform:rotate(6deg)}
      82%{transform:rotate(10deg)}
      88%{transform:rotate(3deg)}
      94%{transform:rotate(5deg)}
      100%{transform:rotate(0deg)}
    }
    @keyframes cp-legs{
      0%{transform:rotate(0deg)}
      10%{transform:rotate(-5deg)}
      20%{transform:rotate(3deg)}
      30%{transform:rotate(-4deg)}
      40%{transform:rotate(4deg)}
      50%{transform:rotate(-3deg)}
      60%{transform:rotate(0deg)}
      64%{transform:rotate(-16deg)}
      68%{transform:rotate(12deg)}
      72%{transform:rotate(-14deg)}
      76%{transform:rotate(10deg)}
      80%{transform:rotate(-8deg)}
      86%{transform:rotate(6deg)}
      92%{transform:rotate(-3deg)}
      100%{transform:rotate(0deg)}
    }
    @keyframes cp-key{
      0%{transform:scaleX(1)}
      5%{transform:scaleX(0.3)}
      10%{transform:scaleX(1)}
      15%{transform:scaleX(0.3)}
      20%{transform:scaleX(1)}
      25%{transform:scaleX(0.3)}
      30%{transform:scaleX(1)}
      35%{transform:scaleX(0.3)}
      40%{transform:scaleX(1)}
      45%{transform:scaleX(0.3)}
      50%{transform:scaleX(1)}
      55%{transform:scaleX(0.3)}
      60%{transform:scaleX(1)}
      65%{transform:scaleX(0.62)}
      70%{transform:scaleX(0.62)}
      73%{transform:scaleX(0.3)}
      76%{transform:scaleX(1)}
      79%{transform:scaleX(0.3)}
      82%{transform:scaleX(1)}
      85%{transform:scaleX(0.3)}
      88%{transform:scaleX(1)}
      91%{transform:scaleX(0.3)}
      94%{transform:scaleX(1)}
      97%{transform:scaleX(0.3)}
      100%{transform:scaleX(1)}
    }
    @keyframes cp-head{
      0%{transform:rotate(0deg)}
      24%{transform:rotate(0deg)}
      25.5%{transform:rotate(-7deg)}
      31%{transform:rotate(-7deg)}
      32.5%{transform:rotate(0deg)}
      61%{transform:rotate(0deg)}
      63%{transform:rotate(13deg)}
      70%{transform:rotate(13deg)}
      72.5%{transform:rotate(-3deg)}
      75%{transform:rotate(0deg)}
      100%{transform:rotate(0deg)}
    }
    @keyframes cp-letter{
      0%{transform:rotate(0deg)}
      15%{transform:rotate(4deg)}
      30%{transform:rotate(-3deg)}
      45%{transform:rotate(4deg)}
      60%{transform:rotate(0deg)}
      66%{transform:rotate(-13deg)}
      73%{transform:rotate(11deg)}
      80%{transform:rotate(-7deg)}
      87%{transform:rotate(4deg)}
      94%{transform:rotate(-2deg)}
      100%{transform:rotate(0deg)}
    }
    @keyframes cp-iris{
      0%,17%{transform:translate(0,0) scaleY(1)}
      18.5%{transform:translate(0,0) scaleY(.12)}
      20%,40%{transform:translate(0,0) scaleY(1)}
      42%,52%{transform:translate(-3px,-1px) scaleY(1)}
      54%,61%{transform:translate(0,0) scaleY(1)}
      63%,71%{transform:translate(1px,3.5px) scaleY(1)}
      73%,100%{transform:translate(0,0) scaleY(1)}
    }
    @keyframes cp-lamp{
      0%{opacity:1} 10%{opacity:0} 20%{opacity:1} 30%{opacity:0} 40%{opacity:1} 50%{opacity:0}
      60%{opacity:1} 62%{opacity:0} 64%{opacity:1} 66%{opacity:0} 68%{opacity:1} 70%{opacity:0}
      72%{opacity:1} 80%{opacity:0} 90%{opacity:1} 100%{opacity:1}
    }
  </style>

  <g transform="translate(165 151)">
    <g class="cp-fly">
    <g transform="translate(-165 -145)">

      <!-- legs, swinging from the belly -->
      <g transform="translate(162 183)">
        <g class="cp-legs">
          <g class="cp-ink">
            <path d="M-12 1 L-18 27"/>
            <path d="M-18 27 L-29 34 M-18 27 L-21 39 M-18 27 L-10 36"/>
            <path d="M12 -1 L8 25"/>
            <path d="M8 25 L-3 32 M8 25 L5 37 M8 25 L16 34"/>
          </g>
        </g>
      </g>

      <!-- tail fan -->
      <g transform="translate(104 146)">
        <g class="cp-tail">
          <path class="cp-pap" d="M1.9 -7.8 L-52.4 -21.3 A8 8 0 0 0 -56.3 -5.8 L-1.9 7.8 A8 8 0 0 0 1.9 -7.8 Z"/>
          <path class="cp-pap" d="M0.6 -8 L-61.3 -12.3 A8 8 0 0 0 -62.4 3.7 L-0.6 8 A8 8 0 0 0 0.6 -8 Z"/>
          <path class="cp-pap" d="M-0.8 -8 L-56.5 -2.1 A8 8 0 0 0 -54.9 13.8 L0.8 8 A8 8 0 0 0 -0.8 -8 Z"/>
        </g>
      </g>

      <!-- wind-up key; the bow narrows and widens as it turns -->
      <g transform="translate(104 124) rotate(-28)">
        <path class="cp-ink" d="M0 0 L0 -15"/>
        <g transform="translate(0 -23)">
          <g class="cp-key">
            <circle class="cp-pap" cx="-8.5" cy="0" r="8"/>
            <circle class="cp-pap" cx="8.5" cy="0" r="8"/>
            <circle class="cp-sol" cx="0" cy="5" r="3.5"/>
          </g>
        </g>
      </g>

      <!-- body -->
      <path class="cp-pap" d="M190 104 C204 100 214 102 218 108 C230 118 236 132 232 146 C226 168 204 182 178 184 C150 186 124 178 108 166 C94 156 90 140 98 128 C110 112 140 102 190 104 Z"/>
      <g class="cp-sol">
        <circle cx="221" cy="142" r="3"/>
        <circle cx="216" cy="157" r="3"/>
        <circle cx="206" cy="169" r="3"/>
      </g>

      <!-- neck rings -->
      <ellipse class="cp-pap" cx="214" cy="110" rx="15.5" ry="5"/>
      <ellipse class="cp-pap" cx="216" cy="102" rx="14" ry="5"/>

      <!-- near wing, hinged at the shoulder -->
      <g transform="translate(182 114)">
        <g class="cp-wing">
          <path class="cp-pap" d="M-14.8 6 L-59.8 24.2 A7.5 7.5 0 0 0 -54.2 38.1 L-9.2 20 A7.5 7.5 0 0 0 -14.8 6 Z"/>
          <path class="cp-pap" d="M-23.6 0.7 L-86.6 14.1 A7.5 7.5 0 0 0 -83.5 28.7 L-20.4 15.3 A7.5 7.5 0 0 0 -23.6 0.7 Z"/>
          <path class="cp-pap" d="M-32.3 -5.5 L-108.7 -2.8 A7.5 7.5 0 0 0 -108.2 12.2 L-31.7 9.5 A7.5 7.5 0 0 0 -32.3 -5.5 Z"/>
          <path class="cp-pap" d="M-41 -12.4 L-122.7 -23.9 A7.5 7.5 0 0 0 -124.7 -9.1 L-43 2.4 A7.5 7.5 0 0 0 -41 -12.4 Z"/>
          <path class="cp-pap" d="M10 0 C10 -13 -6 -18 -28 -16 C-50 -14 -64 -6 -68 2 C-58 11 -30 15 -8 14 C3 13 10 8 10 0 Z"/>
          <path class="cp-ink" d="M-24 -15 C-28 -6 -28 5 -24 13"/>
          <path class="cp-ink" d="M-38 -14 C-42 -6 -42 3 -38 11"/>
          <circle class="cp-pap" cx="0" cy="0" r="8"/>
          <circle class="cp-sol" cx="0" cy="0" r="2.8"/>
        </g>
      </g>

      <!-- head, pivoting on the neck; carries the beak and the letter -->
      <g transform="translate(216 104)">
        <g class="cp-head">
          <g transform="translate(-216 -104)">
            <g transform="translate(258 80)">
              <g class="cp-letter">
                <g transform="rotate(18) translate(-6 -5)">
                  <rect class="cp-pap" x="0" y="0" width="62" height="43" rx="7"/>
                  <path class="cp-ink" d="M4 6 L31 24.5 L58 6"/>
                  <path class="cp-sol" d="M31 37 C25.5 33.5 21 30.5 21 26.5 C21 23.3 23.8 21.6 26.6 23.2 C28.4 24.2 30 25.6 31 27 C32 25.6 33.6 24.2 35.4 23.2 C38.2 21.6 41 23.3 41 26.5 C41 30.5 36.5 33.5 31 37 Z"/>
                </g>
              </g>
            </g>
            <path class="cp-pap" d="M238 67.5 L265 77 L238 84 Z"/>
            <path class="cp-ink" d="M239 68 C241.5 62 249 61.5 251.5 71"/>
            <circle class="cp-pap" cx="220" cy="74" r="23"/>
            <circle class="cp-ink" cx="227" cy="70" r="8.5"/>
            <g transform="translate(229 70)"><g class="cp-iris"><circle class="cp-sol" cx="0" cy="0" r="3.8"/></g></g>
            <path class="cp-ink" d="M218 51 L216 36"/>
            <circle class="cp-pap" cx="215.5" cy="30" r="5.5"/>
            <g class="cp-lamp">
              <circle class="cp-sol" cx="215.5" cy="30" r="2.6"/>
              <path class="cp-ink" d="M205 23 L201 20 M215.5 18 L215.5 13 M226 23 L230 20"/>
            </g>
          </g>
        </g>
      </g>

    </g>
    </g>
  </g>
</svg>
