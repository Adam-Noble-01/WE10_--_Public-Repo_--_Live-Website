<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adam & Caitlin's First Date</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Poppins:wght@300;400;600&display=block"

    <link rel="icon" type="image/svg+xml"
        href="/assets/AD05_-_LIBR_-_Common_-_Icons-and-favicons/AD05_01_-_NA_Favicon_-_SVG-h50mm.svg">
    <!-- PNG Fallbacks for various resolutions -->
    <link rel="icon" type="image/png" sizes="512x512"
        href="/assets/AD05_-_LIBR_-_Common_-_Icons-and-favicons/AD05_04_-_NA_Favicon_-_PNG-h512px.png">
    <link rel="icon" type="image/png" sizes="192x192"
        href="/assets/AD05_-_LIBR_-_Common_-_Icons-and-favicons/AD05_05_-_NA_Favicon_-_PNG-h192px.png">
    <link rel="icon" type="image/png" sizes="32x32"
        href="/assets/AD05_-_LIBR_-_Common_-_Icons-and-favicons/AD05_06_-_NA_Favicon_-_PNG-h32px.png">

    <!-- region StyleSheet ------------------------------- -->
    <style>
        /* Custom styles for the page */
        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Poppins', sans-serif;
            overscroll-behavior-y: contain;
            background-color: #F7FAFC;
            /* Light gray background */
        }

        /* Define scroll snapping container */
        .scroll-container {
            scroll-snap-type: y mandatory;
            overflow-y: scroll;
            height: 100vh;
        }

        /* Define scroll snap sections */
        .scroll-section {
            scroll-snap-align: start;
            scroll-snap-stop: always;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 1rem;
            text-align: center;
            position: relative;
        }

        /* Increase padding on larger screens */
        @media (min-width: 640px) {
            .scroll-section {
                padding: 2rem;
            }
        }

        /* Custom fonts */
        .font-playfair {
            font-family: 'Playfair Display', serif;
        }

        /* Scroll down arrow animation */
        .scroll-down-arrow {
            position: absolute;
            bottom: max(3rem, env(safe-area-inset-bottom) + 2rem);
            left: 50%;
            transform: translateX(-50%);
            animation: bounceAndPulse 2s ease-in-out infinite;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.08));
        }

        /* Increase distance on larger screens */
        @media (min-width: 640px) {
            .scroll-down-arrow {
                bottom: 4rem;
            }
        }

        @keyframes bounceAndPulse {

            0%,
            100% {
                transform: translateX(-50%) translateY(0) scale(1);
                opacity: 0.7;
            }

            25% {
                transform: translateX(-50%) translateY(-12px) scale(1.05);
                opacity: 0.85;
            }

            50% {
                transform: translateX(-50%) translateY(0) scale(1);
                opacity: 0.7;
            }

            75% {
                transform: translateX(-50%) translateY(-6px) scale(1.03);
                opacity: 0.8;
            }
        }

        /* Styling for the content cards */
        .content-card {
            background-color: white;
            border-radius: 1.5rem;
            /* More rounded corners */
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1);
            padding: 1.5rem;
            max-width: 500px;
            width: 90%;
            transition: all 0.3s ease-in-out;
            border: 1px solid #E2E8F0;
            /* Subtle border */
        }

        /* Increase padding on larger screens */
        @media (min-width: 640px) {
            .content-card {
                padding: 2.5rem;
            }
        }

        .pictogram-placeholder {
            width: 80px;
            height: 80px;
            border: 3px dashed #CBD5E0;
            /* Dashed border for pictogram */
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 1rem auto;
            transition: all 0.3s ease-in-out;
        }

        .pictogram-placeholder img {
            width: 100%;
            height: 100%;
            max-width: 60px;
            max-height: 60px;
            object-fit: contain;
        }

        /* Increase size on larger screens */
        @media (min-width: 640px) {
            .pictogram-placeholder {
                width: 100px;
                height: 100px;
                margin: 0 auto 1.5rem auto;
            }

            .pictogram-placeholder img {
                max-width: 75px;
                max-height: 75px;
            }
        }

        .fade-in-up {
            animation: fadeInUp 1s ease-out forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Welcome screen fade in animation - only starts when fonts-loaded class is added */
        .welcome-fade-in {
            opacity: 0;
        }

        .fonts-loaded .welcome-fade-in {
            animation: welcomeFadeIn 2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        @keyframes welcomeFadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        /* Welcome screen arrow: fade in then bounce */
        .fonts-loaded .scroll-down-arrow.welcome-fade-in {
            animation: welcomeFadeIn 2s cubic-bezier(0.4, 0, 0.2, 1) forwards, bounceAndPulse 2s ease-in-out 2s infinite;
        }

        .rsvp-button {
            transition: all 0.2s ease-in-out;
            min-height: 44px;
            min-width: 44px;
            -webkit-tap-highlight-color: transparent;
        }

        .rsvp-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        .rsvp-button:active {
            transform: translateY(0);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        /* Welcome section specific positioning - nudge up on mobile only */
        .scroll-section.bg-rose-50 {
            justify-content: flex-start;
            padding-top: 30vh;
        }

        @media (min-width: 640px) {
            .scroll-section.bg-rose-50 {
                justify-content: center;
                padding-top: 2rem;
            }
        }

        /* Adding different background colors for sections for a subtle effect */
        .scroll-section:nth-child(odd) {
            background-color: #F7FAFC;
        }

        .scroll-section:nth-child(even) {
            background-color: #EDF2F7;
        }

        /* Animation container for RSVP result */
        .result-container {
            font-size: 3.5rem;
            animation: popIn 0.5s cubic-bezier(0.68, -0.55, 0.27, 1.55);
        }

        /* Larger emojis on bigger screens */
        @media (min-width: 640px) {
            .result-container {
                font-size: 5rem;
            }
        }

        @keyframes popIn {
            0% {
                transform: scale(0.5);
                opacity: 0;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }
    </style>
    <!-- endregion StyleSheet ------------------------------- -->



    <!-- region -------------------------------------------->
    <!-- PNG Icon Mapping -->
    <script>
        // Icon key to PNG file path mapping
        const iconPaths = {
            'kitty': './assets/Pictogram01__CatCafe__.png',
            'bratwurst': './assets/Pictogram02__ChristmasMarket__.png',
            'hipster': './assets/Pictogram03__RecordStore__.png',
            'houseplant': './assets/Pictogram04__Houseplant__.png',
            'beer': './assets/Pictogram05__CraftBeer__.png'
        };
    </script>
    <!-- endregion ----------------------------------------- -->
</head>

<body class="text-gray-800">

    <div class="scroll-container">

        <!-- Welcome Section -->
        <section class="scroll-section bg-rose-50 text-rose-800">
            <div class="welcome-fade-in">
                <h1 class="font-playfair text-4xl sm:text-5xl md:text-7xl font-bold mb-4">Adam & Caitlin's</h1>
                <p class="text-2xl sm:text-3xl md:text-5xl font-playfair mb-6">First Date</p>
                <br>
                <p class="text-lg sm:text-xl md:text-2xl bg-rose-200 text-rose-900 px-4 py-2 rounded-full inline-block">
                    Saturday, 6th December
                </p>
            </div>
            <div class="scroll-down-arrow welcome-fade-in">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 sm:h-8 sm:w-8 text-rose-300" fill="none"
                    viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M19 14l-7 7m0 0l-7-7m7 7V3" />
                </svg>
            </div>
        </section>

        <!-- Itinerary Sections will be generated here -->
        <div id="itinerary"></div>

    </div>

    <script>
        // Wait for fonts to load before showing content
        async function loadFonts() {
            try {
                await Promise.all([
                    document.fonts.load('400 1em "Playfair Display"'),
                    document.fonts.load('700 1em "Playfair Display"'),
                    document.fonts.load('300 1em "Poppins"'),
                    document.fonts.load('400 1em "Poppins"'),
                    document.fonts.load('600 1em "Poppins"')
                ]);
                document.documentElement.classList.add('fonts-loaded');
            } catch (error) {
                console.error('Font loading failed:', error);
                // Show content anyway after a timeout
                setTimeout(() => {
                    document.documentElement.classList.add('fonts-loaded');
                }, 1000);
            }
        }

        // Initialize app when DOM is ready
        function initializeApp() {

            const itinerarySteps = [
                {
                    time: '12:00',
                    activity: 'Cuddle Cute Cats',
                    description: 'We\'ll ease into the day with a cosy herbal tea or hot chocolate, find a comfy spot, and have a gentle get-to-know-you chat while we\'re surrounded by ridiculously cute cats. With a bit of luck, a few of them will decide we\'re worthy of head boops, purrs, and maybe even some kitten cuddles on our laps.',
                    iconKey: 'kitty'
                },
                {
                    time: '13:00',
                    activity: 'Peruse The Christmas Market',
                    description: 'Then we\'ll wander over to the Nottingham Winter Wonderland and explore the German-style Christmas market together. We can track down a seriously good bratwurst, soak up the fairy lights and festive music, and maybe point out little gift ideas for each other as we go.',
                    iconKey: 'bratwurst'
                },
                {
                    time: '14:00',
                    activity: 'A Walk Through Hockley',
                    description: 'Next, we\'ll stroll through Hockley and dip into some of the quirky thrift and indie shops. I\'ll take you to my favourite record store so you can witness me trying very hard to be sensible while also eyeing up vinyl I absolutely don\'t need but will probably fall in love with anyway.',
                    iconKey: 'hipster'
                },
                {
                    time: '15:00',
                    activity: 'Arrive At Hipster Heaven',
                    description: 'After that, we\'ll wander down to Sneinton Avenues, a little pocket of independent cafés and shops that means a lot to me because it\'s my old neighbourhood. I\'d love to show you "The Watered Garden", a gorgeous little houseplant boutique, and then introduce you to my favourite artisan chocolate shop, "Luisa\'s Chocolates", where we can sample some gluten free treats. There are plenty of cosy spots and studios around for us to browse and grab something tasty to share.',
                    iconKey: 'houseplant'
                },
                {
                    time: '16:00',
                    activity: 'A Back-Street Brew',
                    description: 'To round things off, we\'ll loop back towards the market square via a tucked-away craft beer bar I used to frequent. It\'s relaxed, a bit stylish, and has a great selection of local artisanal beers. We can clink glasses, savour something delicious, and toast to what I hope will be the first of many lovely dates together.',
                    iconKey: 'beer'
                },
                {
                    type: 'rsvp' // Special type for the final section
                }
            ];

            const itineraryContainer = document.getElementById('itinerary');

            itinerarySteps.forEach((step, index) => {
                const section = document.createElement('section');
                section.className = 'scroll-section';

                const card = document.createElement('div');
                card.className = 'content-card';

                if (step.type === 'rsvp') {
                    card.innerHTML = `<div id="rsvp-content-${index}"></div>`; // Unique ID for RSVP content
                } else {
                    // Get the PNG icon path
                    const iconPath = iconPaths[step.iconKey] || '';

                    card.innerHTML = `
                        <div class="pictogram-placeholder">
                            <img src="${iconPath}" alt="${step.activity}" />
                        </div>
                        <p class="text-lg sm:text-xl font-semibold text-rose-500 bg-rose-100 rounded-full px-4 py-1 inline-block mb-4">${step.time}</p>
                        <h2 class="text-2xl sm:text-3xl md:text-4xl font-playfair font-bold text-gray-900 mb-3">${step.activity}</h2>
                        <p class="text-sm sm:text-base text-gray-600 leading-relaxed">${step.description}</p>
                    `;
                }

                section.appendChild(card);

                // Add scroll arrow to all sections except the last one (RSVP)
                if (step.type !== 'rsvp') {
                    const arrow = document.createElement('div');
                    arrow.className = 'scroll-down-arrow';
                    arrow.innerHTML = `
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 sm:h-8 sm:w-8 text-rose-300" fill="none"
                            viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M19 14l-7 7m0 0l-7-7m7 7V3" />
                        </svg>
                    `;
                    section.appendChild(arrow);
                }

                itineraryContainer.appendChild(section);

                if (step.type === 'rsvp') {
                    const rsvpContainer = document.getElementById(`rsvp-content-${index}`);
                    const originalRsvpHTML = `
                        <h2 class="text-2xl sm:text-3xl md:text-4xl font-playfair font-bold text-gray-900 mb-3">So then Caitlin...</h2>
                        <p class="text-xs text-gray-400 italic mb-4">(My Biggest & Most Admired Weirdo)</p>
                        <p class="text-sm sm:text-base text-gray-600 leading-relaxed mb-8">Would you like to accept Adam's date offer?</p>
                        <div class="flex justify-center gap-4">
                            <button id="yesBtn-${index}" class="rsvp-button bg-rose-500 hover:bg-rose-600 text-white font-bold py-3 px-6 sm:px-8 rounded-full">
                                Yes
                            </button>
                            <button id="noBtn-${index}" class="rsvp-button bg-gray-400 hover:bg-gray-500 text-white font-bold py-3 px-6 sm:px-8 rounded-full">
                                No
                            </button>
                        </div>
                    `;

                    rsvpContainer.innerHTML = originalRsvpHTML;

                    let isProcessing = false;
                    let yesHandler = null;
                    let noHandler = null;

                    const setupRsvpListeners = () => {
                        const yesBtn = document.getElementById(`yesBtn-${index}`);
                        const noBtn = document.getElementById(`noBtn-${index}`);

                        // Remove previous listeners if they exist
                        if (yesHandler) {
                            yesBtn.removeEventListener('click', yesHandler);
                        }
                        if (noHandler) {
                            noBtn.removeEventListener('click', noHandler);
                        }

                        // Create new handler functions
                        yesHandler = () => {
                            if (isProcessing) return;
                            isProcessing = true;

                            rsvpContainer.innerHTML = `
                                <div class="result-container">😊🎉</div>
                                <p class="text-xl sm:text-2xl mt-4 font-playfair font-bold text-green-700">Amazing! He can't wait!</p>
                            `;
                            setTimeout(() => {
                                rsvpContainer.innerHTML = originalRsvpHTML;
                                isProcessing = false;
                                setupRsvpListeners();
                            }, 3000);
                        };

                        noHandler = () => {
                            if (isProcessing) return;
                            isProcessing = true;

                            rsvpContainer.innerHTML = `
                                <div class="result-container">💔😞</div>
                                <p class="text-xl sm:text-2xl mt-4 font-playfair font-bold text-gray-600">That's a shame.</p>
                            `;
                            setTimeout(() => {
                                rsvpContainer.innerHTML = originalRsvpHTML;
                                isProcessing = false;
                                setupRsvpListeners();
                            }, 3000);
                        };

                        // Attach new listeners
                        yesBtn.addEventListener('click', yesHandler);
                        noBtn.addEventListener('click', noHandler);
                    };

                    setupRsvpListeners();
                }
            });

            // Intersection Observer to trigger animations
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.querySelector('.content-card').classList.add('fade-in-up');
                    }
                });
            }, {
                threshold: 0.5 // Trigger when 50% of the element is visible
            });

            document.querySelectorAll('.scroll-section').forEach(section => {
                observer.observe(section);
            });
        }

        document.addEventListener('DOMContentLoaded', async function () {
            await loadFonts();
            initializeApp();
        });
    </script>
</body>

</html>
