    <!-- region StyleSheet ------------------------------- -->
    <style>
        /* Custom styles for the page */
        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Poppins', sans-serif;
            overscroll-behavior-y: contain;
            background-color: #F7FAFC;
            /* Light gray background */
        }

        /* Define scroll snapping container */
        .scroll-container {
            scroll-snap-type: y mandatory;
            overflow-y: scroll;
            height: 100vh;
        }

        /* Define scroll snap sections */
        .scroll-section {
            scroll-snap-align: start;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 2rem;
            text-align: center;
            position: relative;
        }

        /* Custom fonts */
        .font-playfair {
            font-family: 'Playfair Display', serif;
        }

        /* Scroll down arrow animation */
        .scroll-down-arrow {
            position: absolute;
            bottom: 3rem;
            left: 50%;
            transform: translateX(-50%);
            animation: bounce 2s infinite;
        }

        @keyframes bounce {

            0%,
            20%,
            50%,
            80%,
            100% {
                transform: translateX(-50%) translateY(0);
            }

            40% {
                transform: translateX(-50%) translateY(-20px);
            }

            60% {
                transform: translateX(-50%) translateY(-10px);
            }
        }

        /* Styling for the content cards */
        .content-card {
            background-color: white;
            border-radius: 1.5rem;
            /* More rounded corners */
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1);
            padding: 2.5rem;
            max-width: 500px;
            width: 90%;
            transition: all 0.3s ease-in-out;
            border: 1px solid #E2E8F0;
            /* Subtle border */
        }

        .pictogram-placeholder {
            width: 100px;
            height: 100px;
            border: 3px dashed #CBD5E0;
            /* Dashed border for pictogram */
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 1.5rem auto;
            transition: all 0.3s ease-in-out;
        }

        .pictogram-placeholder svg {
            width: 100%;
            height: 100%;
            max-width: 48px;
            max-height: 48px;
        }

        .fade-in-up {
            animation: fadeInUp 1s ease-out forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .rsvp-button {
            transition: all 0.2s ease-in-out;
        }

        .rsvp-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        /* Adding different background colors for sections for a subtle effect */
        .scroll-section:nth-child(odd) {
            background-color: #F7FAFC;
        }

        .scroll-section:nth-child(even) {
            background-color: #EDF2F7;
        }

        /* Animation container for RSVP result */
        .result-container {
            font-size: 5rem;
            animation: popIn 0.5s cubic-bezier(0.68, -0.55, 0.27, 1.55);
        }

        @keyframes popIn {
            0% {
                transform: scale(0.5);
                opacity: 0;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }
    </style>
    <!-- endregion StyleSheet ------------------------------- -->



    <!-- region -------------------------------------------->
    <!-- Early SVG Pictogram Loader with Color Conversion -->
    <script>
        // Global storage for converted pictograms
        window.loadedPictograms = {};
        window.pictogramsLoaded = false;

        // Load and convert SVG colors to #9ca3af
        async function loadAndConvertPictograms() {
            const pictograms = [
                { key: 'cafe', path: './assets/Pictogram01__CafeMeet__.svg' },
                { key: 'paintbrush', path: './assets/Pictogram02__PaintBrush__.svg' },
                { key: 'location', path: './assets/Pictogram03__PlaceMarker__.svg' },
                { key: 'meal', path: './assets/Pictogram04__IndianMeal__.svg' }
            ];

            const targetColor = '#9ca3af'; // Gray-400 color

            for (const pictogram of pictograms) {
                try {
                    const response = await fetch(pictogram.path);
                    let svgText = await response.text();

                    console.log(`Loaded ${pictogram.key}:`, svgText.substring(0, 100)); // Debug

                    // Convert all black and dark colors to target color
                    svgText = svgText
                        .replace(/fill="#000000"/g, `fill="${targetColor}"`)
                        .replace(/fill="#000"/g, `fill="${targetColor}"`)
                        .replace(/fill="black"/g, `fill="${targetColor}"`)
                        .replace(/fill="rgb\(0,\s*0,\s*0\)"/g, `fill="${targetColor}"`)
                        .replace(/stroke="#000000"/g, `stroke="${targetColor}"`)
                        .replace(/stroke="#000"/g, `stroke="${targetColor}"`)
                        .replace(/stroke="black"/g, `stroke="${targetColor}"`);

                    console.log(`Converted ${pictogram.key}:`, svgText.substring(0, 100)); // Debug

                    // Extract SVG and set proper attributes for display
                    const parser = new DOMParser();
                    const svgDoc = parser.parseFromString(svgText, 'image/svg+xml');
                    const svgElement = svgDoc.querySelector('svg');

                    // Remove explicit width/height to allow CSS control
                    svgElement.removeAttribute('width');
                    svgElement.removeAttribute('height');

                    // Store the complete SVG with converted colors
                    window.loadedPictograms[pictogram.key] = svgElement.outerHTML;
                } catch (error) {
                    console.error(`Failed to load pictogram: ${pictogram.path}`, error);
                }
            }

            window.pictogramsLoaded = true;
            console.log('All pictograms loaded:', window.loadedPictograms); // Debug

            // Dispatch event to notify DOM is ready to render
            window.dispatchEvent(new CustomEvent('pictogramsReady'));
        }
        <!-- endregion ----------------------------------------- -->

        // Load pictograms immediately
        loadAndConvertPictograms();
    </script>
</head>

<body class="text-gray-800">

    <div class="scroll-container">

        <!-- Welcome Section -->
        <section class="scroll-section bg-rose-50 text-rose-800">
            <div class="fade-in-up">
                <h1 class="font-playfair text-5xl md:text-7xl font-bold mb-4">Adam & Myah's</h1>
                <p class="text-3xl md:text-5xl font-playfair mb-6">First Date</p>
                <br>
                <p class="text-xl md:text-2xl bg-rose-200 text-rose-900 px-4 py-2 rounded-full inline-block">
                    Saturday, 18th October
                </p>
            </div>
            <div class="scroll-down-arrow">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-rose-500" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M19 14l-7 7m0 0l-7-7m7 7V3" />
                </svg>
            </div>
        </section>

        <!-- Itinerary Sections will be generated here -->
        <div id="itinerary"></div>

    </div>

    <script>
        // Wait for both DOM and pictograms to be ready
        let domReady = false;
        let pictogramsReady = false;

        function initializeApp() {
            if (!domReady || !pictogramsReady) return;

            console.log('Initializing app with pictograms:', window.loadedPictograms); // Debug

            const itinerarySteps = [
                {
                    time: '14:00',
                    activity: 'Meet At <br> Yorks Café',
                    description: 'Let\'s start with a nice cup of Coffee / Herbal Tea / Hot Chocolate & Soft & Sweet pastries whilst we enjoy a lovely chat <br> <br> <em> (Yes I will be marvelling at your pretty face</em>)',
                    iconKey: 'cafe'
                },
                {
                    time: '14:30',
                    activity: 'Explore Ikon <br> Art Gallery',
                    description: 'Immerse ourselves in contemporary art. We can wander through the fascinating exhibitions at our own pace, will it be good or terribly abstract and weird? Who Knows! But it will be fun with you.',
                    iconKey: 'paintbrush'
                },
                {
                    time: '15:45',
                    activity: 'Walk To <br> Our Meal',
                    description: 'A gentle stroll through the city along the marvellous canals of Birmingham as we travel to our delicious dinner destination.',
                    iconKey: 'location'
                },
                {
                    time: '16:00',
                    activity: 'Dinner At <br> Dishoom',
                    description: 'The perfect end to our date. The meal is all booked and ready for us, we will enjoy an amazing Indian meal at the highly-acclaimed Dishoom Restaurant.',
                    iconKey: 'meal'
                },
                {
                    type: 'rsvp' // Special type for the final section
                }
            ];

            const itineraryContainer = document.getElementById('itinerary');

            itinerarySteps.forEach((step, index) => {
                const section = document.createElement('section');
                section.className = 'scroll-section';

                const card = document.createElement('div');
                card.className = 'content-card';

                if (step.type === 'rsvp') {
                    card.innerHTML = `<div id="rsvp-content-${index}"></div>`; // Unique ID for RSVP content
                } else {
                    // Get the loaded pictogram SVG
                    const pictogramSVG = window.loadedPictograms[step.iconKey] || '';

                    console.log(`Rendering ${step.iconKey}:`, pictogramSVG.substring(0, 100)); // Debug

                    card.innerHTML = `
                        <div class="pictogram-placeholder">
                            <div class="h-12 w-12">
                                ${pictogramSVG}
                            </div>
                        </div>
                        <p class="text-xl font-semibold text-rose-500 bg-rose-100 rounded-full px-4 py-1 inline-block mb-4">${step.time}</p>
                        <h2 class="text-3xl md:text-4xl font-playfair font-bold text-gray-900 mb-3">${step.activity}</h2>
                        <p class="text-gray-600 leading-relaxed">${step.description}</p>
                    `;
                }

                section.appendChild(card);
                itineraryContainer.appendChild(section);

                if (step.type === 'rsvp') {
                    const rsvpContainer = document.getElementById(`rsvp-content-${index}`);
                    const originalRsvpHTML = `
                        <h2 class="text-3xl md:text-4xl font-playfair font-bold text-gray-900 mb-3">So then Myah...</h2>
                        <p class="text-xs text-gray-400 italic mb-4">(Myah With a Hard Y)</p>
                        <p class="text-gray-600 leading-relaxed mb-8">Would you like to accept <br> Adam's date offer?</p>
                        <div class="flex justify-center gap-4">
                            <button id="yesBtn-${index}" class="rsvp-button bg-rose-500 hover:bg-rose-600 text-white font-bold py-3 px-8 rounded-full">
                                Yes
                            </button>
                            <button id="noBtn-${index}" class="rsvp-button bg-gray-400 hover:bg-gray-500 text-white font-bold py-3 px-8 rounded-full">
                                No
                            </button>
                        </div>
                    `;

                    rsvpContainer.innerHTML = originalRsvpHTML;

                    const setupRsvpListeners = () => {
                        const yesBtn = document.getElementById(`yesBtn-${index}`);
                        const noBtn = document.getElementById(`noBtn-${index}`);

                        yesBtn.addEventListener('click', () => {
                            rsvpContainer.innerHTML = `
                                <div class="result-container">😊🎉</div>
                                <p class="text-2xl mt-4 font-playfair font-bold text-green-700">Amazing! He can't wait!</p>
                            `;
                            setTimeout(() => {
                                rsvpContainer.innerHTML = originalRsvpHTML;
                                setupRsvpListeners();
                            }, 3000);
                        }, { once: true });

                        noBtn.addEventListener('click', () => {
                            rsvpContainer.innerHTML = `
                                <div class="result-container">💔😞</div>
                                <p class="text-2xl mt-4 font-playfair font-bold text-gray-600">That's a shame.</p>
                            `;
                            setTimeout(() => {
                                rsvpContainer.innerHTML = originalRsvpHTML;
                                setupRsvpListeners();
                            }, 3000);
                        }, { once: true });
                    };

                    setupRsvpListeners();
                }
            });

            // Intersection Observer to trigger animations
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.querySelector('.content-card').classList.add('fade-in-up');
                    }
                });
            }, {
                threshold: 0.5 // Trigger when 50% of the element is visible
            });

            document.querySelectorAll('.scroll-section').forEach(section => {
                observer.observe(section);
            });
        }

        document.addEventListener('DOMContentLoaded', function () {
            domReady = true;
            initializeApp();
        });

        window.addEventListener('pictogramsReady', function () {
            pictogramsReady = true;
            initializeApp();
        });
    </script>
</body>
