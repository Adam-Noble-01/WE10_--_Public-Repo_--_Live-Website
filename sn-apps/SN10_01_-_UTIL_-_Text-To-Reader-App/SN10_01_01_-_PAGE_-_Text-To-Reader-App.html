    <!-- Application Script -->
    <script>
        // Global DOM Elements
        const G_DOM_ELEMENTS = {
            inputText: null,
            renderButton: null,
            clearButton: null,
            output: null
        };

        // -----------------------------------------------------------------------------------------
        // REGION | WhatsApp Message Parser
        // -----------------------------------------------------------------------------------------

        // FUNCTION | Parse WhatsApp Messages
        // -----------------------------------------------------------------------------------------
        // Detects and converts WhatsApp chat format to markdown list format
        // Input:  Raw text with WhatsApp timestamp/sender pattern
        // Output: Markdown formatted list or original text if not WhatsApp format
        // -----------------------------------------------------------------------------------------
        function parseWhatsAppMessages(rawText) {
            const testPattern = /\[\d{1,2}\/\d{1,2},\s*\d{1,2}:\d{2}\]\s*[^:]+:\s*/;         // <-- WhatsApp pattern check

            if (!testPattern.test(rawText)) {
                return rawText;
            }

            const replacePattern = /\[\d{1,2}\/\d{1,2},\s*\d{1,2}:\d{2}\]\s*[^:]+:\s*/g;         // <-- Global replace pattern

            let replaced = rawText.replace(replacePattern, "\n");                       // <-- Remove timestamps/senders
            replaced = replaced.replace(/\n{2,}/g, "\n");                           // <-- Clean multiple newlines
            replaced = replaced.trim();                                             // <-- Trim whitespace
            replaced = replaced.split("\n").map(line => line.trim()).filter(line => line).join("\n- ");  // <-- Convert to list

            if (replaced) {
                replaced = "- " + replaced;                                                     // <-- Add first bullet
            }

            return replaced;
        }

        // endregion -------------------------------------------------------------------------------


        // -----------------------------------------------------------------------------------------
        // REGION | CSV Table Processing
        // -----------------------------------------------------------------------------------------

        // FUNCTION | Detect and Extract CSV Code Blocks
        // -----------------------------------------------------------------------------------------
        // Finds all ```csv code blocks in text and extracts their content
        // Input:  Text potentially containing CSV code blocks
        // Output: Array of objects with CSV content and placeholder tokens
        // -----------------------------------------------------------------------------------------
        function extractCsvBlocks(text) {
            const csvBlockPattern = /```csv\s*[\r\n]+([\s\S]*?)[\r\n]+```/g;                    // <-- Match CSV blocks flexibly
            const csvBlocks = [];                                                         // <-- Storage for blocks
            let match = null;                                                       // <-- Regex match holder

            while ((match = csvBlockPattern.exec(text)) !== null) {
                const csvContent = match[1].trim();                                            // <-- Extract CSV content
                const placeholder = `__CSV_TABLE_${csvBlocks.length}__`;                        // <-- Unique placeholder

                console.log('Found CSV block:', csvContent.substring(0, 100));                 // <-- Debug output

                csvBlocks.push({
                    content: csvContent,
                    placeholder: placeholder,
                    fullMatch: match[0]
                });
            }

            console.log('Total CSV blocks found:', csvBlocks.length);                          // <-- Debug output

            return csvBlocks;
        }

        // FUNCTION | Parse CSV Text to 2D Array
        // -----------------------------------------------------------------------------------------
        // Parses CSV text handling quoted fields and escaped quotes
        // Input:  Raw CSV text with comma-separated values
        // Output: 2D array of parsed values [rows][columns]
        // -----------------------------------------------------------------------------------------
        function parseCsvToArray(csvText) {
            const rows = [];                                                         // <-- Parsed rows storage
            const lines = csvText.split('\n');                                        // <-- Split by newline

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();                                            // <-- Current line

                if (line === '') continue;                                                      // <-- Skip empty lines

                const row = [];                                                         // <-- Current row cells
                let currentCell = '';                                                         // <-- Cell being built
                let inQuotes = false;                                                      // <-- Inside quoted field

                for (let j = 0; j < line.length; j++) {
                    const char = line[j];                                                    // <-- Current character
                    const nextChar = line[j + 1];                                               // <-- Next character

                    if (char === '"') {
                        if (inQuotes && nextChar === '"') {
                            currentCell += '"';                                                 // <-- Escaped quote
                            j++;                                                                // <-- Skip next quote
                        } else {
                            inQuotes = !inQuotes;                                               // <-- Toggle quote state
                        }
                    } else if (char === ',' && !inQuotes) {
                        row.push(currentCell.trim());                                           // <-- End of cell
                        currentCell = '';                                                       // <-- Reset for next
                    } else {
                        currentCell += char;                                                    // <-- Build cell content
                    }
                }

                row.push(currentCell.trim());                                                   // <-- Push final cell
                rows.push(row);                                                                 // <-- Add row to array
            }

            return rows;
        }

        // FUNCTION | Generate HTML Table from CSV Array
        // -----------------------------------------------------------------------------------------
        // Converts 2D CSV array to accessible HTML table
        // Input:  2D array of parsed CSV values
        // Output: HTML string with semantic table markup
        // -----------------------------------------------------------------------------------------
        function generateHtmlTable(csvArray) {
            if (csvArray.length === 0) {
                return '<p style="color: red;">Error: Empty CSV data.</p>';                     // <-- Handle empty
            }

            const headerRow = csvArray[0];                                                // <-- First row = headers
            const dataRows = csvArray.slice(1);                                          // <-- Remaining rows = data

            let tableHtml = '<table role="table" aria-label="CSV Data Table">';         // <-- Table with ARIA

            // Build table header
            tableHtml += '<thead><tr>';                                              // <-- Header section
            for (let i = 0; i < headerRow.length; i++) {
                const cellContent = escapeHtml(headerRow[i]);                                   // <-- Escape HTML
                tableHtml += `<th scope="col">${cellContent}</th>`;                      // <-- Header cell with scope
            }
            tableHtml += '</tr></thead>';                                            // <-- Close header

            // Build table body
            tableHtml += '<tbody>';                                                  // <-- Body section
            for (let i = 0; i < dataRows.length; i++) {
                tableHtml += '<tr>';                                                     // <-- Start row
                for (let j = 0; j < dataRows[i].length; j++) {
                    const cellContent = escapeHtml(dataRows[i][j]);                             // <-- Escape HTML
                    tableHtml += `<td>${cellContent}</td>`;                                  // <-- Data cell
                }
                tableHtml += '</tr>';                                                    // <-- End row
            }
            tableHtml += '</tbody></table>';                                         // <-- Close body and table

            return tableHtml;
        }

        // FUNCTION | Escape HTML Special Characters
        // -----------------------------------------------------------------------------------------
        // Prevents XSS by escaping HTML special characters in text
        // Input:  Raw text string
        // Output: HTML-safe string with escaped characters
        // -----------------------------------------------------------------------------------------
        function escapeHtml(text) {
            const htmlEscapeMap = {                                                             // <-- Character mappings
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };

            return String(text).replace(/[&<>"']/g, function (char) {
                return htmlEscapeMap[char];
            });
        }

        // FUNCTION | Process CSV Blocks in Text
        // -----------------------------------------------------------------------------------------
        // Main processor: detects CSV blocks, converts to tables, replaces in text
        // Input:  Text with potential CSV code blocks
        // Output: Text with CSV blocks replaced by HTML tables
        // -----------------------------------------------------------------------------------------
        function processCsvBlocks(text) {
            const csvBlocks = extractCsvBlocks(text);                                     // <-- Find all CSV blocks

            if (csvBlocks.length === 0) {
                return {                                                                        // <-- Return consistent object
                    processedText: text,
                    csvBlocks: []
                };
            }

            let processedText = text;                                                       // <-- Working copy of text

            // Replace each CSV block with its placeholder
            csvBlocks.forEach(block => {
                processedText = processedText.replace(block.fullMatch, block.placeholder);  // <-- Temporary placeholder
            });

            // After Markdown processing, we'll replace placeholders with tables
            return {
                processedText: processedText,
                csvBlocks: csvBlocks
            };
        }

        // FUNCTION | Replace CSV Placeholders with HTML Tables
        // -----------------------------------------------------------------------------------------
        // Replaces placeholder tokens with rendered HTML tables
        // Input:  HTML text with placeholders, array of CSV blocks
        // Output: Final HTML with rendered tables
        // -----------------------------------------------------------------------------------------
        function replaceCsvPlaceholders(html, csvBlocks) {
            let finalHtml = html;                                                       // <-- Working copy

            csvBlocks.forEach(block => {
                const csvArray = parseCsvToArray(block.content);                             // <-- Parse CSV to array
                const tableHtml = generateHtmlTable(csvArray);                                // <-- Generate table HTML

                // Use regex to find placeholder even when wrapped in HTML tags by Marked.js
                const placeholderRegex = new RegExp(`<p>${block.placeholder}</p>|${block.placeholder}`, 'g');  // <-- Handle wrapped placeholder
                finalHtml = finalHtml.replace(placeholderRegex, tableHtml);             // <-- Replace placeholder
            });

            return finalHtml;
        }

        // endregion -------------------------------------------------------------------------------

        // -----------------------------------------------------------------------------------------
        // REGION | Event Handlers
        // -----------------------------------------------------------------------------------------

        // FUNCTION | Handle Render Button Click
        // -----------------------------------------------------------------------------------------
        // Main rendering pipeline: WhatsApp parsing → CSV processing → Markdown rendering
        // Processes input text and displays formatted output with tables and markdown
        // -----------------------------------------------------------------------------------------
        function handleRenderClick(event) {
            event.preventDefault();

            if (!G_DOM_ELEMENTS.inputText || !G_DOM_ELEMENTS.output) return;
            if (typeof marked === 'undefined') {
                G_DOM_ELEMENTS.output.innerHTML = '<p style="color: red;">Error: Marked.js library failed to load.</p>';
                return;
            }

            const rawInput = G_DOM_ELEMENTS.inputText.value;                             // <-- Get input text
            const cleanedText = parseWhatsAppMessages(rawInput);                            // <-- Process WhatsApp format

            try {
                // Process CSV blocks before Markdown rendering
                const csvResult = processCsvBlocks(cleanedText);                              // <-- Extract CSV blocks

                console.log('CSV Result:', csvResult);                                         // <-- Debug output

                let finalHtml = '';                                                         // <-- Final output HTML

                if (csvResult.csvBlocks.length > 0) {
                    // CSV blocks detected - render with placeholders
                    console.log('Processing', csvResult.csvBlocks.length, 'CSV blocks');      // <-- Debug output
                    const markdownHtml = marked.parse(csvResult.processedText, { sanitize: true });  // <-- Render markdown
                    console.log('Markdown HTML:', markdownHtml.substring(0, 200));            // <-- Debug output
                    finalHtml = replaceCsvPlaceholders(markdownHtml, csvResult.csvBlocks);  // <-- Insert tables
                    console.log('Final HTML:', finalHtml.substring(0, 200));                  // <-- Debug output
                } else {
                    // No CSV blocks - standard Markdown rendering
                    console.log('No CSV blocks detected, using standard markdown');           // <-- Debug output
                    finalHtml = marked.parse(csvResult.processedText, { sanitize: true });   // <-- Render markdown only
                }

                G_DOM_ELEMENTS.output.innerHTML = finalHtml;                                    // <-- Display output

                // Scroll to output on mobile
                if (window.innerWidth <= 768) {
                    G_DOM_ELEMENTS.output.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                }
            } catch (error) {
                G_DOM_ELEMENTS.output.innerHTML = `<p style="color: red;">Error rendering content: ${error.message}</p>`;
            }
        }

        // FUNCTION | Handle Clear Button Click
        // -----------------------------------------------------------------------------------------
        // Clears both input and output areas
        // -----------------------------------------------------------------------------------------

        function handleClearClick() {
            if (G_DOM_ELEMENTS.inputText) G_DOM_ELEMENTS.inputText.value = '';               // <-- Clear input
            if (G_DOM_ELEMENTS.output) G_DOM_ELEMENTS.output.innerHTML = '';                 // <-- Clear output
        }

        // endregion -------------------------------------------------------------------------------


        // -----------------------------------------------------------------------------------------
        // REGION | Application Initialization
        // -----------------------------------------------------------------------------------------

        // FUNCTION | Initialize Application
        // -----------------------------------------------------------------------------------------
        // Caches DOM elements and attaches event listeners
        // Runs after DOM content is loaded
        // -----------------------------------------------------------------------------------------
        function initApp() {
            // Cache DOM elements
            G_DOM_ELEMENTS.inputText = document.getElementById('inputText');
            G_DOM_ELEMENTS.renderButton = document.getElementById('renderButton');
            G_DOM_ELEMENTS.clearButton = document.getElementById('clearButton');
            G_DOM_ELEMENTS.output = document.getElementById('output');

            // Check if all elements were found
            for (const key in G_DOM_ELEMENTS) {
                if (G_DOM_ELEMENTS[key] === null) {
                    console.error(`DOM element for '${key}' not found.`);
                    document.body.innerHTML = '<p style="color: red; font-weight: bold; padding: 20px;">Error: Essential HTML elements are missing.</p>';
                    return;
                }
            }

            // Attach event listeners
            G_DOM_ELEMENTS.renderButton.addEventListener('click', handleRenderClick);         // <-- Render button
            G_DOM_ELEMENTS.clearButton.addEventListener('click', handleClearClick);           // <-- Clear button
        }

        // endregion -------------------------------------------------------------------------------


        // -----------------------------------------------------------------------------------------
        // DOM READY | Initialize Application
        // -----------------------------------------------------------------------------------------
        document.addEventListener('DOMContentLoaded', initApp);
    </script>
