<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="VectorForge — SVG Vector Editor by Noble Architecture">
    <meta name="author" content="Adam Noble - Noble Architecture">
    <title>VectorForge</title>
    <link rel="stylesheet" href="./03__AppStyles/VF__StyleSheet__EditorTheme__.css">
</head>
<body>

    <!-- #Region --- -->
    <!-- REGION | App Shell -->
    <!-- ----- -->

    <div id="app">

        <!-- #Region --- -->
        <!-- UI HEADER | Top Bar — Logo, Status Bar, Controls -->
        <!-- ----- -->

        <header class="top-bar">

            <div style="display:flex; align-items:center; gap:8px;">
                <div style="width:24px; height:24px; background:var(--color-blue-600); display:flex; align-items:center; justify-content:center; border-radius:3px;">
                    <svg style="width:16px; height:16px; color:white;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 20l10-10m0 0l6 6M14 10l6-6M4 4l10 10"/>
                    </svg>
                </div>
                <div class="logo">VECTOR_FORGE v1.0</div>
            </div>

            <div class="status-bar" id="status-bar" style="flex:1; justify-content:center;">
                <span>Zoom: <span id="zoom-level">100%</span></span>
                <span>Pos: <span id="cursor-pos">0, 0</span></span>
                <span>Canvas: <span id="canvas-px">800x600 px</span> (<span id="canvas-mm">211.7x158.8 mm</span>)</span>
            </div>

            <div style="display:flex; gap:8px; align-items:center;">
                <button id="snap-toggle-btn" style="padding:6px 12px; background:transparent; color:var(--color-slate-600); border:1px solid var(--color-slate-300); border-radius:4px; font-size:11px; font-weight:bold; cursor:pointer; text-transform:uppercase;">Snap: Off</button>
                <input type="file" id="svg-upload-input" accept=".svg" style="display:none;">
                <button id="upload-svg-btn" style="padding:6px 12px; background:var(--color-blue-600); color:white; border:none; border-radius:4px; font-size:11px; font-weight:bold; cursor:pointer; text-transform:uppercase;">Upload SVG</button>
            </div>

        </header>

        <!-- endregion ---- -->


        <!-- #Region --- -->
        <!-- UI MAIN | Main Workspace — Toolbar, Canvas, Right Panel -->
        <!-- ----- -->

        <div class="main-workspace">

            <!-- TOOLBAR -->
            <aside class="toolbar" id="toolbar">
                <button data-tool="select" class="active" title="Select (V)">
                    <svg style="width:16px; height:16px;" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M7.001 3L5.001 4.5l6 11.5l1.5-4.5l4.5 5.5l1.5-1.5l-5.5-4.5l4.5-1.5L7.001 3z"/>
                    </svg>
                </button>
                <button data-tool="line" title="Line (L)">
                    <svg style="width:20px; height:20px;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-width="2" d="M5 19L19 5"/>
                    </svg>
                </button>
                <button data-tool="path" title="Path (P)">
                    <svg style="width:20px; height:20px;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/>
                    </svg>
                </button>
                <button data-tool="rect" title="Rectangle (R)">
                    <svg style="width:20px; height:20px;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <rect x="5" y="5" width="14" height="14" rx="1" stroke-width="2"/>
                    </svg>
                </button>
            </aside>

            <!-- CANVAS -->
            <main class="canvas-container" id="canvas-container">
                <!-- SVGCanvas injects the SVG element here at runtime -->
            </main>

            <!-- RIGHT PANEL -->
            <aside class="right-panel">

                <div class="panel layers-panel" id="layers-panel">
                    <h3>Layers</h3>
                    <div class="layer-list" id="layer-list"></div>
                    <button id="add-layer-btn">+ New Layer</button>
                </div>

                <div class="panel properties-panel" id="properties-panel" style="display:flex; flex-direction:column;">
                    <div class="panel-tabs" style="display:flex; background:var(--color-slate-100); border-bottom:1px solid var(--color-slate-300); flex-shrink:0;">
                        <button class="tab-btn active" data-target="props-content" style="flex:1; padding:8px 12px; font-size:11px; font-weight:700; color:var(--color-slate-800); text-transform:uppercase; background:white; border:none; border-right:1px solid var(--color-slate-300); border-bottom:2px solid var(--color-blue-600); cursor:pointer;">Properties</button>
                        <button class="tab-btn" data-target="code-content" style="flex:1; padding:8px 12px; font-size:11px; font-weight:700; color:var(--color-slate-500); text-transform:uppercase; background:transparent; border:none; border-bottom:2px solid transparent; cursor:pointer;">Code</button>
                    </div>
                    <div id="props-content" style="flex:1; overflow-y:auto;">Select an object</div>
                    <textarea id="code-content" spellcheck="false" placeholder="Press Ctrl+Shift+Enter to sync changes to canvas" style="display:none; flex:1; resize:none; border:none; outline:none; overflow-y:auto; padding:12px; font-family:var(--font-mono); font-size:11px; color:var(--color-slate-700); background:#f8fafc; white-space:pre-wrap; word-break:break-all;"></textarea>
                </div>

            </aside>

        </div>

        <!-- endregion ---- -->

    </div>

    <!-- endregion ---- -->

    <script type="module" src="./VF__App__Main__.js"></script>

</body>
</html>
