<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="VectorForge — SVG Vector Editor by Noble Architecture">
    <meta name="author" content="Adam Noble - Noble Architecture">
    <title>VectorForge</title>
    <link rel="icon" type="image/svg+xml" href="https://www.noble-architecture.com/assets/AD05_-_LIBR_-_Common_-_Icons-and-favicons/AD05_01_-_NA_Favicon_-_SVG-h50mm.svg">
    <link rel="icon" type="image/x-icon" href="https://www.noble-architecture.com/assets/AD05_-_LIBR_-_Common_-_Icons-and-favicons/AD05_07_-_NA_Favicon_-_ICO-h32px.ico">
    <link rel="stylesheet" href="./03__AppStyles/VF__StyleSheet__EditorTheme__.css">
</head>
<body>

    <!-- #Region --- -->
    <!-- REGION | App Shell -->
    <!-- ----- -->

    <div id="app">

        <!-- #Region --- -->
        <!-- UI HEADER | Top Bar — Logo, Status Bar, Controls -->
        <!-- ----- -->

        <header class="top-bar">

            <div class="top-bar__logo-group">
                <img
                    class="top-bar__logo-mark"
                    src="https://www.noble-architecture.com/assets/AD05_-_LIBR_-_Common_-_Icons-and-favicons/AD05_01_-_NA_Favicon_-_SVG-h50mm.svg"
                    alt="Noble Architecture">
                <div class="logo">VectorForge | v0.2.2 - Alpha</div>
            </div>

            <div class="status-bar status-bar--centred" id="status-bar">
                <span>Zoom: <span id="zoom-level">100%</span></span>
                <span>Pos: <span id="cursor-pos">0, 0</span></span>
                <span>Canvas: <span id="canvas-px">800x600 px</span> (<span id="canvas-mm">211.7x158.8 mm</span>)</span>
            </div>

            <div class="top-bar__controls">
                <button id="snap-toggle-btn" class="btn btn--secondary">Snap: Off</button>
                <button id="point-edit-btn" class="btn btn--secondary" title="Toggle Vector Point Edit (E / Ctrl)">Points: Off</button>
                <input type="file" id="svg-upload-input" accept=".svg">
                <button id="upload-svg-btn" class="btn btn--primary">Upload SVG</button>
            </div>

        </header>

        <!-- endregion ---- -->


        <!-- #Region --- -->
        <!-- UI MAIN | Main Workspace — Toolbar, Canvas, Right Panel -->
        <!-- ----- -->

        <div class="main-workspace">

            <!-- TOOLBAR -->
            <aside class="toolbar" id="toolbar">
                <button data-tool="select" class="active" title="Select (V / Esc)">
                    <svg fill="currentColor" viewBox="0 0 24 24">
                        <path d="M7.001 3L5.001 4.5l6 11.5l1.5-4.5l4.5 5.5l1.5-1.5l-5.5-4.5l4.5-1.5L7.001 3z"/>
                    </svg>
                </button>
                <button data-tool="line" title="Line (L)">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-width="2" d="M5 19L19 5"/>
                    </svg>
                </button>
                <button data-tool="path" title="Path (P)">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/>
                    </svg>
                </button>
                <button data-tool="rect" title="Rectangle (R)">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <rect x="5" y="5" width="14" height="14" rx="1" stroke-width="2"/>
                    </svg>
                </button>
            </aside>

            <!-- CANVAS -->
            <main class="canvas-container" id="canvas-container">
                <!-- SVGCanvas injects the SVG element here at runtime -->
            </main>

            <!-- RIGHT PANEL -->
            <aside class="right-panel" id="right-panel">
                <div class="panel-resize-handle" id="panel-resize-handle"></div>

                <div class="panel layers-panel" id="layers-panel">
                    <h3>Layers</h3>
                    <div class="layer-list" id="layer-list"></div>
                    <button id="add-layer-btn">+ New Layer</button>
                </div>

                <div class="panel properties-panel" id="properties-panel">
                    <div class="panel-tabs">
                        <button class="tab-btn active" data-target="props-content">Properties</button>
                        <button class="tab-btn" data-target="code-content">Code</button>
                    </div>
                    <div id="props-content">Select an object</div>
                    <textarea id="code-content" spellcheck="false" placeholder="Press Ctrl+Shift+Enter to sync changes to canvas"></textarea>
                </div>

            </aside>

        </div>

        <!-- endregion ---- -->

    </div>

    <!-- endregion ---- -->

    <script type="module" src="./VF__App__Main__.js"></script>

</body>
</html>
