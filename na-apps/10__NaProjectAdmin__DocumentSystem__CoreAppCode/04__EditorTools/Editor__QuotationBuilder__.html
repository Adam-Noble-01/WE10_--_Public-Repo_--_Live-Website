<!DOCTYPE html>
<html lang="en">

<!-- #Region ------------------------------------------ -->
<!-- REGION | Document Head                            -->
<!-- -------------------------------------------------- -->

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="googlebot" content="noindex, nofollow">
    <title>Quotation Builder | Noble Architecture</title>
    <link rel="icon" type="image/x-icon"
        href="../../01__Assets__NaApps__CommonAssets/NaApps__CommonIcons/CommonIcon__NaFavicon__ICO-h32px.ico">
    <link rel="stylesheet" href="Editor__CommonStylesheet__.css">

    <!-- Load DateFormatter Module -->
    <script src="../03__Src__AppModules/03__CommonUtils/CommonUtils__DateFormatter__.js"></script>
    <!-- Load Shared Editor Utilities -->
    <script src="Editor__SharedUtils__.js"></script>
</head>
<!-- endregion ---------------------------------------- -->

<!-- #Region ------------------------------------------ -->
<!-- REGION | Document Body                            -->
<!-- -------------------------------------------------- -->

<body>

    <!-- #Region ------------------------------------------ -->
    <!-- UI HEADER | Application Header                    -->
    <!-- -------------------------------------------------- -->
    <header class="app-header">
        <h1>Quotation Builder</h1>
        <div class="header-actions">
            <button class="btn btn--secondary" onclick="loadFromProject()" id="btnLoadProject"
                style="display: none;">Load from Project</button>
            <button class="btn btn--primary" onclick="saveToProject()" id="btnSaveProject" style="display: none;">Save
                to Project</button>
        </div>
    </header>
    <!-- endregion ---------------------------------------- -->

    <!-- #Region ------------------------------------------ -->
    <!-- UI MAIN | Main Content Container                  -->
    <!-- -------------------------------------------------- -->
    <div class="main-container">

        <!-- #Region -------------------------------------- -->
        <!-- UI PANEL | Editor Panel                       -->
        <!-- ---------------------------------------------- -->
        <div class="panel">
            <div class="panel__header">Edit Quotation</div>
            <div class="panel__body">

                <div class="info-box" id="flaskInfoBox"
                    style="display: none; background: #e8f8e8; border-color: #28a745;">
                    <strong>✓ Flask Server Connected</strong><br>
                    Auto-loading and saving to project folder is enabled.
                    <span id="projectPathDisplay"></span>
                </div>

                <!-- Project Details -->
                <h3 class="section-heading section-heading--first">Project Details</h3>

                <div class="form-group">
                    <label for="quotationRef">Quotation Reference</label>
                    <input type="text" id="quotationRef" class="form-input" placeholder="e.g., QUO-JH03-2026-001"
                        onchange="updatePreview(); markFormDirty()">
                </div>

                <div class="form-group">
                    <label for="quotationDate">Quotation Date</label>
                    <input type="date" id="quotationDate" class="form-input"
                        onchange="updatePreview(); markFormDirty()">
                </div>

                <div class="form-group">
                    <label for="projectAddress">Project Address</label>
                    <input type="text" id="projectAddress" class="form-input" placeholder="Site address"
                        onchange="updatePreview(); markFormDirty()">
                </div>

                <div class="form-group">
                    <label for="projectDescription">Project Description</label>
                    <textarea id="projectDescription" class="form-input" placeholder="Brief description of the project"
                        onchange="updatePreview(); markFormDirty()"></textarea>
                </div>

                <!-- Client Details -->
                <h3 class="section-heading">Client Details</h3>

                <div class="form-group">
                    <label for="clientName">Client Name</label>
                    <input type="text" id="clientName" class="form-input" placeholder="Full name"
                        onchange="updatePreview(); markFormDirty()">
                </div>

                <div class="form-group">
                    <label for="clientAddress">Client Address</label>
                    <textarea id="clientAddress" class="form-input" placeholder="Address"
                        onchange="updatePreview(); markFormDirty()"></textarea>
                </div>

                <div class="form-group">
                    <label for="clientEmail">Client Email</label>
                    <input type="email" id="clientEmail" class="form-input" placeholder="email@example.com"
                        onchange="updatePreview(); markFormDirty()">
                </div>

                <!-- Line Items -->
                <h3 class="section-heading">Line Items</h3>

                <table class="line-items-table">
                    <thead>
                        <tr>
                            <th class="col-description">Description</th>
                            <th class="col-qty">Qty</th>
                            <th class="col-unit">Unit</th>
                            <th class="col-rate">Rate (£)</th>
                            <th class="col-amount">Amount</th>
                            <th class="col-actions"></th>
                        </tr>
                    </thead>
                    <tbody id="lineItemsBody">
                    </tbody>
                </table>

                <div class="actions-bar">
                    <button class="btn btn--secondary" onclick="addLineItem()">+ Add Item</button>
                    <button class="btn btn--secondary" onclick="addGroupHeader()">+ Add Group</button>
                </div>

                <div class="totals">
                    <div class="totals__row">
                        <span>Subtotal</span>
                        <span id="subtotal">£0.00</span>
                    </div>
                    <div class="totals__row">
                        <label style="display: flex; align-items: center; gap: 0.5rem;">
                            <input type="checkbox" id="showVat" onchange="updatePreview(); markFormDirty()">
                            VAT (<input type="number" id="vatRate" value="20" style="width: 50px;"
                                onchange="updatePreview(); markFormDirty()">%)
                        </label>
                        <span id="vatAmount">£0.00</span>
                    </div>
                    <div class="totals__row totals__row--grand">
                        <span>Total</span>
                        <span id="grandTotal">£0.00</span>
                    </div>
                </div>
            </div>
        </div>
        <!-- endregion ------------------------------------ -->

    </div>
    <!-- endregion ---------------------------------------- -->

</body>
<!-- endregion ---------------------------------------- -->

<!-- #Region ------------------------------------------ -->
<!-- REGION | JavaScript Logic                         -->
<!-- -------------------------------------------------- -->

<script>

    // #Region ------------------------------------------------
    // CONSTANTS | Configuration
    // --------------------------------------------------------

    const QUOTATION_FILENAME = 'ProjectAdmin__Quotation__.json';

    // endregion ----------------------------------------------

    // #Region ------------------------------------------------
    // STATE | Application State
    // --------------------------------------------------------

    let lineItems = [];                                              // <-- Line items array
    let lineItemId = 0;                                              // <-- ID counter
    let isFlaskMode = false;                                         // <-- Flask server available
    let currentProjectCode = null;                                   // <-- Currently loaded project
    let currentYear = null;                                          // <-- Current year
    let isEmbedded = false;                                          // <-- Running in iframe

    // endregion ----------------------------------------------

    // #Region ------------------------------------------------
    // INITIALIZATION | DOM Ready
    // --------------------------------------------------------

    document.addEventListener('DOMContentLoaded', async function () {
        // Check if embedded in iframe
        isEmbedded = window.location.search.includes('embedded=true');

        // Initialise project context
        if (window.NaEditorTools) {
            const context = NaEditorTools.initialiseProjectContext();
            currentProjectCode = context.project;
            currentYear = context.year;

            // Check for Flask server
            isFlaskMode = await NaEditorTools.isLocalDevServer();

            if (isFlaskMode) {
                setupFlaskMode();
                // Auto-load quotation
                await autoLoadQuotation();
            }

            // Setup unsaved changes warning
            NaEditorTools.setupUnsavedChangesWarning();

            // Create status bar
            await NaEditorTools.createStatusBar();
        }

        // Set today's date as default
        document.getElementById('quotationDate').valueAsDate = new Date();

        // Add default line item if empty
        if (lineItems.length === 0) {
            addLineItem();
        }

        updatePreview();
    });

    // Setup Flask mode UI
    function setupFlaskMode() {
        document.getElementById('flaskInfoBox').style.display = 'block';
        document.getElementById('btnLoadProject').style.display = 'inline-block';
        document.getElementById('btnSaveProject').style.display = 'inline-block';

        // Update project path display
        const pathDisplay = document.getElementById('projectPathDisplay');
        if (pathDisplay && currentProjectCode) {
            pathDisplay.innerHTML = `<br><code>${currentYear}-Projects/${currentProjectCode}/</code>`;
        }
    }

    // Auto-load quotation from Flask server
    async function autoLoadQuotation() {
        if (!isFlaskMode || !currentProjectCode) return;

        NaEditorTools.showInfoMessage(`Loading ${QUOTATION_FILENAME}...`);

        const data = await NaEditorTools.loadProjectFile(QUOTATION_FILENAME, currentProjectCode, currentYear);

        if (data) {
            populateFormFromData(data);
            NaEditorTools.showSuccessMessage(`Loaded: ${QUOTATION_FILENAME}`);
        } else {
            NaEditorTools.showInfoMessage('No existing quotation found - starting fresh');
            // Generate default quotation reference
            document.getElementById('quotationRef').value = `QUO-${currentProjectCode}-${new Date().getFullYear()}-001`;
        }
    }

    // endregion ----------------------------------------------

    // #Region ------------------------------------------------
    // FORM POPULATION | Load Data into Form
    // --------------------------------------------------------

    function populateFormFromData(data) {
        // Populate form fields
        document.getElementById('quotationRef').value = data.quotationRef || '';

        // Handle date - convert from UK format if needed
        if (data.quotationDate) {
            // Try to parse UK date format (DD-MMM-YYYY)
            const ukDateMatch = data.quotationDate.match(/^(\d{1,2})-([A-Za-z]{3})-(\d{4})$/);
            if (ukDateMatch) {
                const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
                const monthIndex = months.findIndex(m => m.toLowerCase() === ukDateMatch[2].toLowerCase());
                if (monthIndex !== -1) {
                    const isoDate = `${ukDateMatch[3]}-${String(monthIndex + 1).padStart(2, '0')}-${ukDateMatch[1].padStart(2, '0')}`;
                    document.getElementById('quotationDate').value = isoDate;
                }
            } else {
                // Try standard date parse
                const date = new Date(data.quotationDate);
                if (!isNaN(date)) {
                    document.getElementById('quotationDate').value = date.toISOString().split('T')[0];
                }
            }
        }

        document.getElementById('projectAddress').value = data.projectAddress || '';
        document.getElementById('projectDescription').value = data.projectDescription || '';
        document.getElementById('clientName').value = data.clientDetails?.name || '';
        document.getElementById('clientAddress').value = data.clientDetails?.address || '';
        document.getElementById('clientEmail').value = data.clientDetails?.email || '';

        if (data.totals?.vatRate > 0) {
            document.getElementById('showVat').checked = true;
            document.getElementById('vatRate').value = data.totals.vatRate;
        }

        // Load line items
        lineItems = [];
        lineItemId = 0;

        if (data.lineItems) {
            let currentGroup = '';
            data.lineItems.forEach(item => {
                if (item.group && item.group !== currentGroup) {
                    currentGroup = item.group;
                    lineItems.push({
                        id: ++lineItemId,
                        type: 'group',
                        name: item.group
                    });
                }
                lineItems.push({
                    id: ++lineItemId,
                    type: 'item',
                    group: item.group || '',
                    description: item.description,
                    quantity: item.quantity,
                    unit: item.unit,
                    rate: item.rate
                });
            });
        }

        renderLineItems();
        updatePreview();

        if (window.NaEditorTools) {
            NaEditorTools.markClean();
        }
    }

    // Mark form as having unsaved changes
    function markFormDirty() {
        if (window.NaEditorTools) {
            NaEditorTools.markDirty();
        }
    }

    // endregion ----------------------------------------------

    // #Region ------------------------------------------------
    // LINE ITEM MANAGEMENT | Add, Remove, Update Items
    // --------------------------------------------------------

    // Add new line item
    function addLineItem(group = '') {
        const id = ++lineItemId;
        lineItems.push({
            id: id,
            type: 'item',
            group: group,
            description: '',
            quantity: 1,
            unit: 'item',
            rate: 0
        });
        renderLineItems();
        markFormDirty();
    }

    // Add group header
    function addGroupHeader() {
        const id = ++lineItemId;
        const groupName = prompt('Enter group/phase name:', 'Design Phase');
        if (groupName) {
            lineItems.push({
                id: id,
                type: 'group',
                name: groupName
            });
            renderLineItems();
            markFormDirty();
        }
    }

    // Remove line item
    function removeLineItem(id) {
        lineItems = lineItems.filter(item => item.id !== id);
        renderLineItems();
        updatePreview();
        markFormDirty();
    }

    // endregion ----------------------------------------------

    // #Region ------------------------------------------------
    // RENDERING | Display Line Items
    // --------------------------------------------------------

    // Render line items table
    function renderLineItems() {
        const tbody = document.getElementById('lineItemsBody');
        let currentGroup = '';

        tbody.innerHTML = lineItems.map(item => {
            if (item.type === 'group') {
                currentGroup = item.name;
                return `
                        <tr style="background: #f5f5f5;">
                            <td colspan="5">
                                <input type="text" value="${item.name}" 
                                       style="font-weight: bold; border: none; background: transparent; width: 100%;"
                                       onchange="updateGroupName(${item.id}, this.value)">
                            </td>
                            <td class="col-actions">
                                <button class="btn btn--danger btn--small" onclick="removeLineItem(${item.id})">×</button>
                            </td>
                        </tr>
                    `;
            } else {
                const amount = (item.quantity || 0) * (item.rate || 0);
                return `
                        <tr>
                            <td class="col-description">
                                <input type="text" value="${item.description}" 
                                       onchange="updateItem(${item.id}, 'description', this.value)" placeholder="Description">
                            </td>
                            <td class="col-qty">
                                <input type="number" value="${item.quantity}" min="0" step="0.5"
                                       onchange="updateItem(${item.id}, 'quantity', parseFloat(this.value))">
                            </td>
                            <td class="col-unit">
                                <input type="text" value="${item.unit}" 
                                       onchange="updateItem(${item.id}, 'unit', this.value)" placeholder="item">
                            </td>
                            <td class="col-rate">
                                <input type="number" value="${item.rate}" min="0" step="0.01"
                                       onchange="updateItem(${item.id}, 'rate', parseFloat(this.value))">
                            </td>
                            <td class="col-amount">£${amount.toFixed(2)}</td>
                            <td class="col-actions">
                                <button class="btn btn--danger btn--small" onclick="removeLineItem(${item.id})">×</button>
                            </td>
                        </tr>
                    `;
            }
        }).join('');
    }

    // Update item property
    function updateItem(id, property, value) {
        const item = lineItems.find(i => i.id === id);
        if (item) {
            item[property] = value;
            renderLineItems();
            updatePreview();
            markFormDirty();
        }
    }

    // Update group name
    function updateGroupName(id, name) {
        const item = lineItems.find(i => i.id === id);
        if (item) {
            const oldName = item.name;
            item.name = name;
            // Update all items in this group
            lineItems.forEach(i => {
                if (i.type === 'item' && i.group === oldName) {
                    i.group = name;
                }
            });
            updatePreview();
            markFormDirty();
        }
    }

    // endregion ----------------------------------------------

    // #Region ------------------------------------------------
    // CALCULATIONS | Totals and VAT
    // --------------------------------------------------------

    // Calculate subtotal, VAT, and grand total
    function calculateTotals() {
        let subtotal = 0;
        lineItems.forEach(item => {
            if (item.type === 'item') {
                subtotal += (item.quantity || 0) * (item.rate || 0);
            }
        });

        const showVat = document.getElementById('showVat').checked;
        const vatRate = parseFloat(document.getElementById('vatRate').value) || 0;
        const vat = showVat ? subtotal * (vatRate / 100) : 0;
        const total = subtotal + vat;

        document.getElementById('subtotal').textContent = '£' + subtotal.toFixed(2);
        document.getElementById('vatAmount').textContent = '£' + vat.toFixed(2);
        document.getElementById('grandTotal').textContent = '£' + total.toFixed(2);

        return { subtotal, vatRate: showVat ? vatRate : 0, vat, total };
    }

    // endregion ----------------------------------------------

    // #Region ------------------------------------------------
    // JSON GENERATION | Build Quotation Object
    // --------------------------------------------------------

    // Generate quotation JSON
    function generateJson() {
        const totals = calculateTotals();

        // Build line items array with groups
        let currentGroup = '';
        const formattedItems = lineItems
            .filter(item => item.type === 'item')
            .map(item => {
                // Find which group this item belongs to
                const groupIndex = lineItems.findIndex(i => i.type === 'group' && i.id < item.id);
                const group = groupIndex >= 0 ? lineItems.slice(0, item.id).filter(i => i.type === 'group').pop()?.name : '';

                return {
                    description: item.description,
                    quantity: item.quantity,
                    unit: item.unit,
                    rate: item.rate,
                    group: group || undefined
                };
            });

        // Use DateFormatter if available
        const formatDate = window.NaProjectAdmin?.DateFormatter?.formatDateToUK;
        const nowUKTime = window.NaProjectAdmin?.DateFormatter?.nowUKWithTime?.() || new Date().toLocaleString('en-GB');

        let quotationDate = document.getElementById('quotationDate').value;
        if (formatDate && quotationDate) {
            quotationDate = formatDate(quotationDate);
        }

        const quotation = {
            quotationRef: document.getElementById('quotationRef').value,
            quotationDate: quotationDate,
            projectAddress: document.getElementById('projectAddress').value,
            projectDescription: document.getElementById('projectDescription').value,
            clientDetails: {
                name: document.getElementById('clientName').value,
                address: document.getElementById('clientAddress').value,
                email: document.getElementById('clientEmail').value
            },
            lineItems: formattedItems,
            totals: {
                subtotal: totals.subtotal,
                vatRate: totals.vatRate,
                vat: totals.vat,
                grandTotal: totals.total
            },
            additionalTerms: '',
            createdDate: nowUKTime
        };

        return quotation;
    }

    // endregion ----------------------------------------------

    // #Region ------------------------------------------------
    // UI ACTIONS | User Interface Updates
    // --------------------------------------------------------

    // Update totals display
    function updatePreview() {
        calculateTotals();
    }

    // endregion ----------------------------------------------

    // #Region ------------------------------------------------
    // FILE OPERATIONS | Load and Save Functions
    // --------------------------------------------------------

    // Load from project (Flask API)
    async function loadFromProject() {
        if (!isFlaskMode) {
            alert('Flask server not available');
            return;
        }

        // Check for unsaved changes
        if (window.NaEditorTools?.hasUnsavedChanges()) {
            NaEditorTools.showSaveConfirmDialog(
                QUOTATION_FILENAME,
                async () => {
                    await saveToProject();
                    await doLoadFromProject();
                },
                async () => {
                    await doLoadFromProject();
                },
                () => { }
            );
            return;
        }

        await doLoadFromProject();
    }

    async function doLoadFromProject() {
        const data = await NaEditorTools.loadProjectFile(QUOTATION_FILENAME, currentProjectCode, currentYear);

        if (data) {
            populateFormFromData(data);
            NaEditorTools.showSuccessMessage(`Loaded: ${QUOTATION_FILENAME}`);
        } else {
            NaEditorTools.showErrorMessage('Failed to load quotation');
        }
    }

    // Save to project (Flask API)
    async function saveToProject() {
        if (!isFlaskMode) {
            alert('Flask server not available');
            return;
        }

        const data = generateJson();

        NaEditorTools.showConfirmDialog(
            'Save Quotation',
            `Save changes to <strong>${QUOTATION_FILENAME}</strong>?<br><br>This will overwrite the existing file.`,
            async () => {
                const success = await NaEditorTools.saveProjectFile(QUOTATION_FILENAME, data, currentProjectCode, currentYear);
                if (success) {
                    NaEditorTools.markClean();
                }
            },
            null,
            { confirmText: 'Save', cancelText: 'Cancel' }
        );
    }

    // endregion ----------------------------------------------

</script>
<!-- endregion ---------------------------------------- -->

</html>
