<!DOCTYPE html>
<!-- =============================================================================
     PROJECT ADMIN - INVOICE EMAIL EMBEDDABLE CARD
     =============================================================================
     
     FILE       : Distribution__ProjectInvoice__EmailLink__.html
     AUTHOR     : Adam Noble - Noble Architecture
     PURPOSE    : Email-embeddable HTML card for project invoice notification
     CREATED    : 2026
     
     DESCRIPTION:
     - Professional email card for sending invoice details to clients
     - Uses inline CSS for maximum email client compatibility
     - Table-based layout for robust rendering across email clients
     - Absolute URLs for all assets hosted on GitHub Pages
     - Project Admin branded styling matching WebApp design
     - Dynamic injection via query parameters (InjectionLogic script)
     
     USAGE:
     - Generated from the Invoice Manager editor tool
     - Opens in browser with invoice data as query parameters
     - Drag and drop the card directly into your email client
     - Or select and copy (Ctrl+C / Cmd+C) then paste into email
     
     =============================================================================
-->
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invoice Email Card - Noble Architecture</title>
    <style>
        /* Open Sans Font Face Declarations */
        @font-face {
            font-family: 'Open Sans';
            font-style: normal;
            font-weight: 300;
            src: url('https://www.noble-architecture.com/na-apps/01__Assets__NaApps__CommonAssets/NaApps__CommonFonts/CommonFont-01__OpenSans__Light__.ttf') format('truetype');
            font-display: swap;
        }

        @font-face {
            font-family: 'Open Sans';
            font-style: normal;
            font-weight: 400;
            src: url('https://www.noble-architecture.com/na-apps/01__Assets__NaApps__CommonAssets/NaApps__CommonFonts/CommonFont-01__OpenSans__Regular__.ttf') format('truetype');
            font-display: swap;
        }

        @font-face {
            font-family: 'Open Sans';
            font-style: normal;
            font-weight: 600;
            src: url('https://www.noble-architecture.com/na-apps/01__Assets__NaApps__CommonAssets/NaApps__CommonFonts/CommonFont-01__OpenSans__SemiBold__.ttf') format('truetype');
            font-display: swap;
        }

        body {
            font-family: 'Open Sans', Arial, sans-serif;
            background-color: #f5f5f5;
            padding: 40px 20px;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
    </style>
</head>

<body>
    <!-- ========================================================= -->
    <!-- INVOICE EMAIL CARD - START                                -->
    <!-- OUTLOOK COMPATIBLE VERSION - Simplified CSS               -->
    <!-- ========================================================= -->
    <table cellpadding="0" cellspacing="0" border="0"
        style="font-family: 'Open Sans', Arial, sans-serif; max-width: 500px; width: 100%; margin: 20px auto; border: 2px solid #555041;">

        <!-- Noble Architecture Logo -->
        <tr>
            <td align="center" bgcolor="#ffffff" style="background-color: #ffffff; padding: 25px 30px 15px;">
                <img src="https://www.noble-architecture.com/na-apps/01__Assets__NaApps__CommonAssets/NaApps__CommonGraphics/NaBrandGraphic__CompanyLogo__w2048xh500px__.png"
                    alt="Noble Architecture Logo" width="240" border="0"
                    style="display: block; max-width: 100%; height: auto;">
            </td>
        </tr>

        <!-- Header Section -->
        <tr>
            <td align="center" bgcolor="#ffffff" style="background-color: #ffffff; padding: 15px 30px 5px;">
                <p style="margin: 0; padding: 0; color: #656565; font-size: 21px; font-family: 'Open Sans', Arial, sans-serif;">
                    Project Invoice
                </p>
            </td>
        </tr>

        <!-- Invoice Details Section -->
        <tr>
            <td bgcolor="#ffffff" style="background-color: #ffffff; padding: 20px 30px 10px;">

                <!-- Invoice Reference -->
                <table cellpadding="0" cellspacing="0" border="0" style="width: 100%; margin-bottom: 18px;">
                    <tr>
                        <td align="center" style="padding: 10px 20px; background-color: #f8f7f5; border-radius: 6px;">
                            <p style="margin: 0; padding: 0; color: #555041; font-size: 18px; font-weight: 600; font-family: 'Open Sans', Arial, sans-serif;"
                                id="invoiceRefDisplay">{{INVOICE_REF}}</p>
                        </td>
                    </tr>
                </table>

                <!-- Date Details -->
                <table cellpadding="0" cellspacing="0" border="0" style="width: 100%; margin-bottom: 6px;">
                    <tr>
                        <td style="padding: 4px 8px 4px 0; color: #656565; font-size: 14px; font-family: 'Open Sans', Arial, sans-serif; width: 145px;">
                            Invoice Issued On:
                        </td>
                        <td style="padding: 4px 0; color: #555041; font-size: 14px; font-weight: 600; font-family: 'Open Sans', Arial, sans-serif;"
                            id="invoiceDateDisplay">{{INVOICE_DATE}}</td>
                    </tr>
                    <tr>
                        <td style="padding: 4px 8px 4px 0; color: #656565; font-size: 14px; font-family: 'Open Sans', Arial, sans-serif; width: 145px;">
                            Payment Due By:
                        </td>
                        <td style="padding: 4px 0; color: #555041; font-size: 14px; font-weight: 600; font-family: 'Open Sans', Arial, sans-serif;"
                            id="dueDateDisplay">{{DUE_DATE}}</td>
                    </tr>
                </table>

                <!-- Project Address (conditional) -->
                <table cellpadding="0" cellspacing="0" border="0" style="width: 100%; margin-bottom: 6px;"
                    id="projectAddressRow">
                    <tr>
                        <td style="padding: 4px 0; color: #656565; font-size: 14px; font-family: 'Open Sans', Arial, sans-serif; width: 120px;">
                            Project:
                        </td>
                        <td style="padding: 4px 0; color: #555041; font-size: 14px; font-family: 'Open Sans', Arial, sans-serif;"
                            id="projectAddressDisplay">{{PROJECT_ADDRESS}}</td>
                    </tr>
                </table>

            </td>
        </tr>

        <!-- Personal Note (conditional) -->
        <tr id="personalNoteRow">
            <td bgcolor="#ffffff" style="background-color: #ffffff; padding: 15px 30px 5px;">
                <p align="center"
                    style="margin: 0; padding: 0; color: #555041; font-size: 14px; line-height: 1.6; font-style: italic; font-family: 'Open Sans', Arial, sans-serif;"
                    id="personalNoteDisplay">{{PERSONAL_NOTE}}</p>
            </td>
        </tr>

        <!-- Call to Action Button -->
        <tr>
            <td bgcolor="#ffffff" style="background-color: #ffffff; padding: 15px 30px 25px;">
                <table cellpadding="0" cellspacing="0" border="0" style="width: 100%;">
                    <tr>
                        <td align="center" style="padding: 10px 0;">
                            <table cellpadding="0" cellspacing="0" border="0"
                                style="border-radius: 8px; overflow: hidden;">
                                <tr>
                                    <td align="center" bgcolor="#595959"
                                        style="background-color: #595959; padding: 14px 32px; border-radius: 8px;">
                                        <a href="{{INVOICE_URL}}" id="invoiceLink"
                                            target="_blank"
                                            style="color: #ffffff; text-decoration: none; font-size: 15px; font-weight: 600; font-family: 'Open Sans', Arial, sans-serif; display: block;">
                                            View &amp; Pay Invoice
                                        </a>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>

        <!-- Footer Section -->
        <tr>
            <td align="center" bgcolor="#f5f5f5"
                style="background-color: #f5f5f5; padding: 15px 30px; border-top: 1px solid #e0e0e0;">
                <p align="center"
                    style="margin: 0; padding: 0; color: #656565; font-size: 12px; line-height: 1.8; font-family: 'Open Sans', Arial, sans-serif;">
                    If you have any queries regarding this invoice,<br>
                    please contact <a href="mailto:Billing@Noble-Architecture.com"
                        style="color: #555041; text-decoration: underline;">Billing@Noble-Architecture.com</a>
                </p>
            </td>
        </tr>
    </table>
    <!-- ========================================================= -->
    <!-- INVOICE EMAIL CARD - END                                  -->
    <!-- ========================================================= -->

    <!-- Injection Logic - Populates template from URL parameters -->
    <script src="Distribution__ProjectInvoice__EmailLink__InjectionLogic__.js"></script>

</body>

</html>
