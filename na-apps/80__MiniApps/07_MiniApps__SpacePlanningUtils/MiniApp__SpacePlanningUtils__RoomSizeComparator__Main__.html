<!-- =============================================================================
  NOBLE ARCHITECTURE - MINI APP - ROOM SIZE COMPARATOR
  =============================================================================

  FILE    : MiniApp__SpacePlanningUtils__RoomSizeComparator__Main__.html
  AUTHOR  : Adam Noble - Noble Architecture
  PURPOSE : Compare a room's floor area with typical UK sizes for its room type
  CREATED : 16-Nov-2026

  DESCRIPTION:
  - Type a room's area, or its length and width, in square metres or square
    feet; flip units at any time without losing the value.
  - Compare: the room type's five size bands (Min, Small, Medium, Large, O/S)
    drawn to scale as nested boxes from a shared corner, with your room in
    orange on top, a furniture piece for scale, and a verdict in words.
  - All Rooms: every room type side by side on one scale, with your area as a
    line across them all.
  - Data & Sources: every figure, what changed from the original sheet and
    why, and the sources behind each room. Copies straight into Google Sheets.
  - All processing is local. No data is sent to any server.

  MODULES:
  - 01__AppModules/MiniApp__SpacePlanningUtils__RoomSizeComparator__Main__.js        (controller: config, state, events)
  - 01__AppModules/MiniApp__SpacePlanningUtils__RoomSizeComparator__Units__.js       (m² / ft² maths, parsing, formatting)
  - 01__AppModules/MiniApp__SpacePlanningUtils__RoomSizeComparator__RoomData__.js    (data load, classify an area)
  - 01__AppModules/MiniApp__SpacePlanningUtils__RoomSizeComparator__PlanDrawing__.js (to-scale SVG drawing, PNG export)
  - 01__AppModules/MiniApp__SpacePlanningUtils__RoomSizeComparator__CompareView__.js (verdict, band strip, band table, notes)
  - 01__AppModules/MiniApp__SpacePlanningUtils__RoomSizeComparator__AllRoomsView__.js (every room on one scale)
  - 01__AppModules/MiniApp__SpacePlanningUtils__RoomSizeComparator__DataView__.js    (figures, changes and sources)
  - 01__AppModules/MiniApp__SpacePlanningUtils__RoomSizeComparator__UrlState__.js    (shareable link, remembered units)
  - 02__AppData/RoomSizeComparator__RoomSizeData__UK__.json                          (validated room data and sources)
  - MiniApp__SpacePlanningUtils__RoomSizeComparator__Style__.css                     (styles)
  - MiniApp__SpacePlanningUtils__RoomSizeComparator__AppConfig__.json                (config source)

  =========================================================================== -->

                        <!-- --------------------------------------------- -->
                            <div class="RSC__toolbar">

                        <!-- REGION | Your Room Controls                   -->

                        <!-- --------------------------------------------- -->

                                    <select id="js__roomSelect" class="RSC__select"></select>
                                </div>

                                <div class="RSC__field RSC__field--size">

                                        <span id="js__sizeLabel" class="RSC__label">Your room</span>
                                        <div class="RSC__segmented RSC__segmented--small" role="radiogroup" aria-label="Enter the size as">
                                            <label><input type="radio" name="js__inputMode" value="area" checked /><span id="js__modeAreaLabel">Area</span></label>
                                            <label><input type="radio" name="js__inputMode" value="dims" /><span id="js__modeDimsLabel">Length × width</span></label>
                                        </div>
                                    </div>

                                    <div id="js__areaRow" class="RSC__input-row">
                                        <input id="js__areaInput" class="RSC__input RSC__input--area" type="text" inputmode="decimal"

                                        <span id="js__areaSuffix" class="RSC__suffix">m²</span>
                                    </div>

                                    <div id="js__dimsRow" class="RSC__input-row" hidden>
                                        <input id="js__lengthInput" class="RSC__input RSC__input--dim" type="text" inputmode="decimal"
                                               autocomplete="off" spellcheck="false" placeholder="Length" aria-label="Length" />
                                        <span class="RSC__suffix js__lengthSuffix">m</span>
                                        <span class="RSC__times" aria-hidden="true">×</span>
                                        <input id="js__widthInput" class="RSC__input RSC__input--dim" type="text" inputmode="decimal"
                                               autocomplete="off" spellcheck="false" placeholder="Width" aria-label="Width" />
                                        <span class="RSC__suffix js__lengthSuffix">m</span>
                                    </div>

                                    <p id="js__inputNote" class="RSC__input-note" role="status" aria-live="polite"></p>
                                </div>

                                <div class="RSC__field RSC__field--actions">
                                    <button id="js__clearBtn" class="RSC__btn RSC__btn--ghost" type="button">Clear</button>
                                    <button id="js__copyLinkBtn" class="RSC__btn RSC__btn--ghost" type="button">Copy link</button>
                                </div>

                                    <div class="RSC__card RSC__card--plan">

                                            <h2 id="js__planTitle" class="RSC__card-title"></h2>
                                            <div class="RSC__card-tools">

                                                    <input type="checkbox" id="js__furnitureToggle" checked />

                                        </div>

                    "./01__AppModules/MiniApp__SpacePlanningUtils__RoomSizeComparator__PlanDrawing__.js"  : "./01__AppModules/MiniApp__SpacePlanningUtils__RoomSizeComparator__PlanDrawing__.js?v=1.0.0",
                    "./01__AppModules/MiniApp__SpacePlanningUtils__RoomSizeComparator__CompareView__.js"  : "./01__AppModules/MiniApp__SpacePlanningUtils__RoomSizeComparator__CompareView__.js?v=1.0.0",
                    "./01__AppModules/MiniApp__SpacePlanningUtils__RoomSizeComparator__AllRoomsView__.js" : "./01__AppModules/MiniApp__SpacePlanningUtils__RoomSizeComparator__AllRoomsView__.js?v=1.0.0",
                    "./01__AppModules/MiniApp__SpacePlanningUtils__RoomSizeComparator__DataView__.js"     : "./01__AppModules/MiniApp__SpacePlanningUtils__RoomSizeComparator__DataView__.js?v=1.0.0",

                }

            </script>

            <script type="module" src="01__AppModules/MiniApp__SpacePlanningUtils__RoomSizeComparator__Main__.js?v=1.0.0"></script>
