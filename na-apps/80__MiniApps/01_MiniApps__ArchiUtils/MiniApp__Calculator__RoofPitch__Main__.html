<!DOCTYPE html>

<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roof Pitch Calculator</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f0f2f5;
        margin: 0;
        padding: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
    }
    .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 15px;
        background: #ffffff;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        margin-bottom: 20px;
        justify-content: center;
        width: 100%;
        max-width: 800px;
        box-sizing: border-box;
    }
    .input-group {
        display: flex;
        flex-direction: column;
    }
    label {
        font-weight: bold;
        margin-bottom: 5px;
        font-size: 14px;
        color: #333;
    }
    input {
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 5px;
        font-size: 16px;
        width: 140px;
    }
    input[readonly] {
        background-color: #e9ecef;
        cursor: not-allowed;
        color: #495057;
        font-weight: bold;
    }
    .canvas-container {
        width: 100%;
        max-width: 800px;
        background: #ffffff;
        border-radius: 10px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
        box-sizing: border-box;
        overflow-x: auto;
    }
    canvas {
        max-width: 100%;
        height: auto;
        display: block;
    }
</style>
</head>
<body>

<div class="controls">
    <div class="input-group">
        <label for="bottom">Bottom (mm)</label>
        <input type="number" id="bottom" value="2185" oninput="calculate()">
    </div>
    <div class="input-group">
        <label for="pitch">Pitch Angle (°)</label>
        <input type="number" id="pitch" value="42.5" oninput="calculate()">
    </div>
    <div class="input-group">
        <label for="vertical">Vertical (mm)</label>
        <input type="number" id="vertical" readonly="">
    </div>
    <div class="input-group">
        <label for="hypotenuse">Diagonal (mm)</label>
        <input type="number" id="hypotenuse" readonly="">
    </div>
</div>

<div class="canvas-container">
    <canvas id="canvas" width="800" height="500"></canvas>
</div>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    function calculate() {
        const bottom = parseFloat(document.getElementById('bottom').value);
        const pitch = parseFloat(document.getElementById('pitch').value);
        
        const verticalInput = document.getElementById('vertical');
        const hypotenuseInput = document.getElementById('hypotenuse');

        if (bottom > 0 && pitch > 0 && pitch < 90) {
            const radians = pitch * (Math.PI / 180);
            
            const vertical = bottom * Math.tan(radians);
            const hypotenuse = bottom / Math.cos(radians);
            
            verticalInput.value = vertical.toFixed(1);
            hypotenuseInput.value = hypotenuse.toFixed(1);
            
            drawTriangle(bottom, vertical, hypotenuse, pitch);
        } else {
            verticalInput.value = '';
            hypotenuseInput.value = '';
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
    }

    function drawTriangle(bottom, vertical, hypotenuse, angle) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const padding = 100;
        const drawAreaW = canvas.width - padding * 2;
        const drawAreaH = canvas.height - padding * 2;

        const scale = Math.min(drawAreaW / bottom, drawAreaH / vertical);

        const scaledW = bottom * scale;
        const scaledH = vertical * scale;

        const startX = (canvas.width - scaledW) / 2;
        const startY = (canvas.height + scaledH) / 2;
        const rightX = startX + scaledW;
        const topY = startY - scaledH;

        ctx.beginPath();
        ctx.moveTo(startX, startY);
        ctx.lineTo(rightX, startY);
        ctx.lineTo(rightX, topY);
        ctx.closePath();
        
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#2c3e50';
        ctx.stroke();
        ctx.fillStyle = 'rgba(52, 152, 219, 0.1)';
        ctx.fill();

        const sqSize = 25;
        ctx.beginPath();
        ctx.moveTo(rightX - sqSize, startY);
        ctx.lineTo(rightX - sqSize, startY - sqSize);
        ctx.lineTo(rightX, startY - sqSize);
        ctx.stroke();

        const arcRad = 60;
        ctx.beginPath();
        ctx.arc(startX, startY, arcRad, 0, -angle * (Math.PI / 180), true);
        ctx.stroke();

        ctx.fillStyle = '#000';
        ctx.font = 'bold 20px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        // Bottom
        ctx.fillText(bottom.toFixed(1) + ' mm', startX + scaledW / 2, startY + 35);
        
        // Vertical
        ctx.save();
        ctx.translate(rightX + 35, startY - scaledH / 2);
        ctx.rotate(-Math.PI / 2);
        ctx.fillText(vertical.toFixed(1) + ' mm', 0, 0);
        ctx.restore();

        // Diagonal
        ctx.save();
        const midX = startX + scaledW / 2;
        const midY = startY - scaledH / 2;
        const hypAngle = Math.atan2(-scaledH, scaledW);
        ctx.translate(midX, midY);
        ctx.rotate(hypAngle);
        ctx.fillText(hypotenuse.toFixed(1) + ' mm', 0, -25);
        ctx.restore();

        // Angle
        ctx.fillText(angle + '°', startX + arcRad + 35, startY - 25);
    }

    window.onload = calculate;
</script>




</body></html>
