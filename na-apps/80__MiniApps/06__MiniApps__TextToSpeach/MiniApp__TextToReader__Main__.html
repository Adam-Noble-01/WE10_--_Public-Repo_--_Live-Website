<!-- =============================================================================
  NOBLE ARCHITECTURE - MINI APP - TEXT TO READER
  =============================================================================

  FILE    : MiniApp__TextToReader__Main__.html
  AUTHOR  : Adam Noble - Noble Architecture
  PURPOSE : Render WhatsApp chat exports, Markdown, and CSV blocks as readable HTML
  CREATED : 19-Sep-2026

  DESCRIPTION:
  - Paste or upload Markdown, WhatsApp chat text, or ```csv``` blocks.
  - Three views: Simple (quick paste and render), Edit (full-page Markdown),
    and Read (full-page article for browser read-aloud).
  - WhatsApp timestamp/sender prefixes are stripped and converted to a list.
  - CSV fenced blocks become accessible HTML tables.
  - All processing is local — no data is sent to any server.

  MODULES:
  - 01__AppModules/MiniApp__TextToReader__Main__.js            (controller)
  - 01__AppModules/MiniApp__TextToReader__ViewTabs__.js        (Simple / Edit / Read)
  - 01__AppModules/MiniApp__TextToReader__WhatsAppParser__.js  (chat cleanup)
  - 01__AppModules/MiniApp__TextToReader__CsvTable__.js        (CSV to tables)
  - 01__AppModules/MiniApp__TextToReader__FileUpload__.js      (local file load)
  - 01__AppModules/MiniApp__TextToReader__MarkdownRender__.js  (render pipeline)
  - MiniApp__TextToReader__MarkdownStyle__.css                 (A4 Markdown document styles)
  - MiniApp__TextToReader__AppConfig__.json                    (config source)

  =========================================================================== -->

<!DOCTYPE html>
<html lang="en-GB">

<!-- ----------------------------------------------------------------- -->
<!-- REGION | Document Head                                            -->
<!-- ----------------------------------------------------------------- -->
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="Noble Architecture Text To Reader — render WhatsApp, Markdown and CSV as readable HTML." />
        <meta name="author" content="Adam Noble - Noble Architecture" />
        <title>Text To Reader Utility</title>

        <link rel="icon" type="image/svg+xml"
              href="../../01__Assets__NaApps__CommonAssets/NaApps__CommonIcons/CommonIcon__NaLogoFavicon__SVG-h50mm.svg" />

        <link rel="stylesheet"
              href="../../../assets/AD02_-_STYL_-_Common_-_StyleSheets/AD02_30_-_STYL_-_Core-Default-Web-Utility-App-Stylesheet.css" />
        <link rel="stylesheet" href="MiniApp__TextToReader__Style__.css" />
        <!-- @delegate: MiniApp__TextToReader__MarkdownStyle__.css -->
        <link rel="stylesheet" href="MiniApp__TextToReader__MarkdownStyle__.css" />
    </head>
<!-- endregion -------------------------------------------------------- -->

<!-- ----------------------------------------------------------------- -->
<!-- REGION | Document Body                                            -->
<!-- ----------------------------------------------------------------- -->
    <body data-ttr-mode="simple">
        <div class="PAGE__container">

            <!-- --------------------------------------------------------- -->
            <!-- REGION | Page Header                                      -->
            <!-- Header, tabs, version and upload are aria-hidden so the   -->
            <!-- browser read-aloud reader skips them and speaks only the  -->
            <!-- rendered article — especially on the Read view.           -->
            <!-- --------------------------------------------------------- -->
                <header class="HEAD__container TTR__chrome" aria-hidden="true">
                    <div class="HEAD__nav TTR__header-nav">
                        <div id="js__appTitle" class="HEAD__title">Text To Reader Utility</div>

                        <!-- @delegate: 01__AppModules/MiniApp__TextToReader__ViewTabs__.js -->
                        <!-- Divs, not buttons: focusable controls inside aria-hidden
                             cause browsers to ignore aria-hidden and read the chrome. -->
                        <div class="TTR__tablist">
                            <div id="js__tabSimple"
                                 class="TTR__tab TTR__tab--active"
                                 data-ttr-tab="simple">Simple</div>
                            <div id="js__tabEdit"
                                 class="TTR__tab"
                                 data-ttr-tab="edit">Edit</div>
                            <div id="js__tabRead"
                                 class="TTR__tab"
                                 data-ttr-tab="read">Read</div>
                        </div>

                        <div class="TTR__header-end">
                            <span id="js__uploadFileStatus" class="TTR__upload-status"></span>
                            <span id="js__appVersion" class="HEAD__version-note"></span>

                            <!-- @delegate: 01__AppModules/MiniApp__TextToReader__FileUpload__.js -->
                            <input id="js__fileUploadInput"
                                   class="TTR__upload-input"
                                   type="file"
                                   accept=".md,.markdown,.txt,text/markdown,text/plain"
                                   hidden />
                            <div id="js__uploadFileButton"
                                 class="TTR__upload-icon-button"
                                 title="Upload Markdown / Text File">
                                <svg class="TTR__upload-icon"
                                     viewBox="0 0 24 24"
                                     fill="none"
                                     stroke="currentColor"
                                     stroke-width="1.75"
                                     stroke-linecap="round"
                                     stroke-linejoin="round"
                                     focusable="false">
                                    <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z" />
                                    <path d="M14 3v5h5" />
                                    <path d="M8 13h8" />
                                    <path d="M8 17h6" />
                                </svg>
                            </div>
                        </div>
                    </div>
                </header>
            <!-- endregion ------------------------------------------------ -->

            <!-- --------------------------------------------------------- -->
            <!-- REGION | Main Content                                     -->
            <!-- --------------------------------------------------------- -->
                <div class="FULL__page-app-container">
                    <main class="MAIN__container">

                        <!-- --------------------------------------------- -->
                        <!-- REGION | Input Area                           -->
                        <!-- --------------------------------------------- -->
                            <section class="FORM__block TTR__panel TTR__panel--input">
                                <label id="js__inputLabel" for="js__inputText" class="FORM__label TTR__simple-only">
                                    Input Text (Markdown, WhatsApp Messages or CSV Blocks):
                                </label>

                                <textarea id="js__inputText"
                                          class="FORM__textarea"
                                          placeholder="Paste your text (WhatsApp or Markdown) here..."></textarea>
                            </section>
                        <!-- endregion ------------------------------------ -->

                        <!-- --------------------------------------------- -->
                        <!-- REGION | Action Buttons                       -->
                        <!-- --------------------------------------------- -->
                            <section class="CTRL__block TTR__panel TTR__panel--actions TTR__simple-only">
                                <h2 id="js__actionsHeading" class="CTRL__heading TTR__simple-only">Actions</h2>
                                <div class="BTTN__container">
                                    <button id="js__renderButton" class="BTTN__standard" type="button">Render Text</button>
                                    <button id="js__clearButton"  class="BTTN__cancel"   type="button">Clear Text</button>
                                </div>
                            </section>
                        <!-- endregion ------------------------------------ -->

                        <!-- --------------------------------------------- -->
                        <!-- REGION | Output Area                          -->
                        <!-- --------------------------------------------- -->
                            <section class="RSLT__block TTR__panel TTR__panel--output">
                                <h2 id="js__outputHeading" class="CTRL__heading TTR__simple-only">Output</h2>
                                <article id="js__output"
                                         class="MAIN__output"
                                         tabindex="-1"></article>
                            </section>
                        <!-- endregion ------------------------------------ -->

                    </main>
                </div>
            <!-- endregion ------------------------------------------------ -->

            <!-- --------------------------------------------------------- -->
            <!-- REGION | Page Footer                                      -->
            <!-- --------------------------------------------------------- -->
                <footer class="FOOT__container TTR__chrome" aria-hidden="true">
                    <span id="js__pageFooter">© 2026 Noble Architecture | All Rights Reserved</span>
                </footer>
            <!-- endregion ------------------------------------------------ -->

        </div>

        <script type="module" src="01__AppModules/MiniApp__TextToReader__Main__.js"></script>
    </body>
<!-- endregion -------------------------------------------------------- -->

</html>
