<svg xmlns="http://www.w3.org/2000/svg" class="NaSpeedo" data-speed="2" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" stroke="#172b3a" stroke-width="60" stroke-linecap="round" stroke-linejoin="round">
  <style>
    .NaSpeedo__needle {
