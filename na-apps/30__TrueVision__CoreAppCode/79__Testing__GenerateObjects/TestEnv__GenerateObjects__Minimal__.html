<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TrueVision3D - Generate Objects Test Environment</title>
    <style>
        /* ----------------------------------------------------------------------------- */
        /* REGION | Generate Objects Test Environment - CSS */
        /* ----------------------------------------------------------------------------- */

        /* ----------------------------------------------------------------------------- */
        /* SUB REGION | Base Layout and Canvas */
        /* ----------------------------------------------------------------------------- */

        /* Base Layout */
        html, body {
            margin      : 0;
            padding     : 0;
            width       : 100%;
            height      : 100%;
            overflow    : hidden;
            background  : #0e0e12;
            color       : #f5f5f5;
            font-family : Arial, Helvetica, sans-serif;
        }

        /* Render Canvas */
        #appCanvas {
            display : block;
            width   : 100%;
            height  : 100%;
        }

        /* ----------------------------------------------------------------------------- */
        /* SUB REGION | Overlay Panels */
        /* ----------------------------------------------------------------------------- */

        /* Top Left Status Panel */
        #hudInfo {
            position      : fixed;
            top           : 12px;
            left          : 12px;
            padding       : 10px 12px;
            border-radius : 8px;
            background    : rgba(0, 0, 0, 0.55);
            font-size     : 13px;
            line-height   : 1.4;
            z-index       : 10;
            max-width     : 360px;
        }

        /* Code Input Panel */
        #codePanel {
            position      : fixed;
            top           : 12px;
            right         : 12px;
            width         : min(48vw, 720px);
            height        : min(74vh, 780px);
            padding       : 10px;
            border-radius : 10px;
            background    : rgba(0, 0, 0, 0.65);
            border        : 1px solid rgba(255, 255, 255, 0.18);
            z-index       : 20;
            display       : flex;
            flex-direction : column;
            gap           : 8px;
        }

        /* ----------------------------------------------------------------------------- */
        /* SUB REGION | Inputs, Buttons, and Status */
        /* ----------------------------------------------------------------------------- */

        /* Raw Code Textarea */
        #codeInput {
            flex          : 1;
            width         : 100%;
            resize        : none;
            border        : 1px solid #3d3d47;
            border-radius : 6px;
            background    : #12121a;
            color         : #f2f4ff;
            padding       : 10px;
            box-sizing : border-box;
            font-size     : 12px;
            line-height : 1.4;
            font-family   : Consolas, "Courier New", monospace;
        }

        /* Buttons Row */
        #buttonRow {
            display   : flex;
            flex-wrap : wrap;
            gap       : 6px;
        }

        /* Generic Action Button */
        .actionBtn {
            background    : #1f1f2c;
            color         : #f5f5f5;
            border        : 1px solid #4a4a64;
            border-radius : 6px;
            padding       : 6px 10px;
            font-size     : 12px;
            cursor        : pointer;
        }

        .actionBtn:hover {
            background : #2a2a3a;
        }

        /* Runtime Status */
        #statusLine {
            min-height    : 18px;
            font-size     : 12px;
            color         : #90ee90;
            white-space   : nowrap;
            overflow      : hidden;
            text-overflow : ellipsis;
        }

        /* endregion ------------------------------------------------------------------- */
    </style>
</head>
<body>
    <!-- ----------------------------------------------------------------- -->
    <!-- REGION | Generate Objects Test Environment - HTML -->
    <!-- ----------------------------------------------------------------- -->

    <!-- ----------------------------------------------------------------- -->
    <!-- UI MENU | 3D Render Canvas -->
    <!-- ----------------------------------------------------------------- -->
    <canvas id="appCanvas"></canvas>

    <!-- ----------------------------------------------------------------- -->
    <!-- UI MENU | Test Environment Info Panel -->
    <!-- ----------------------------------------------------------------- -->
    <div id="hudInfo">
        <strong>Generate Objects Test Env</strong><br />
        Paste raw module code into the textbox and click <code>Load Pasted Code</code>.<br />
        Controls: <code>S</code> Spawn, <code>U</code> Unspawn.
    </div>

    <!-- ----------------------------------------------------------------- -->
    <!-- UI MENU | Code Input and Runtime Controls -->
    <!-- ----------------------------------------------------------------- -->
    <div id="codePanel">
        <textarea id="codeInput" spellcheck="false" placeholder="Paste your code block here...

You can paste as-is, including:
- import * as THREE from 'three';
- export function Na__GenerateObject__CreateAnimatedBallCloud(...) { ... }"></textarea>

        <div id="buttonRow">
            <button class="actionBtn" id="loadCodeBtn">Load Pasted Code</button>
            <button class="actionBtn" id="spawnBtn">Spawn</button>
            <button class="actionBtn" id="unspawnBtn">Unspawn</button>
        </div>

        <div id="statusLine">Ready.</div>
    </div>
    <!-- endregion ----------------------------------------------------------------- -->

    <script type="module">
        import * as THREE from "https://unpkg.com/three@0.161.0/build/three.module.js";

        // -----------------------------------------------------------------------------
        // REGION | Scene Setup
        // -----------------------------------------------------------------------------

            const canvas = document.getElementById("appCanvas");
            const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.setSize(window.innerWidth, window.innerHeight);

            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x121218);

            const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 200);
            camera.position.set(0, 2.5, 10);
            camera.lookAt(0, 1, 0);

            const hemiLight = new THREE.HemisphereLight(0xffffff, 0x222244, 1.25);
            scene.add(hemiLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
            dirLight.position.set(4, 6, 3);
            scene.add(dirLight);

            const floor = new THREE.GridHelper(20, 20, 0x334455, 0x27303a);
            floor.position.y = -2;
            scene.add(floor);

            const axes = new THREE.AxesHelper(2);
            scene.add(axes);
        // endregion -------------------------------------------------------------------


        // -----------------------------------------------------------------------------
        // REGION | Update Loop Registry
        // -----------------------------------------------------------------------------

            const registeredUpdates = [];
            const activeGenerators = [];
            let Na__GenerateObject__CreateAnimatedBallCloud = null;
            let Na__GenerateObject__CreateAnimatedRGBBoxes = null;
            let Na__GenerateObject__CreateAnimatedWhiteStars = null;

            const codeInput = document.getElementById("codeInput");
            const statusLine = document.getElementById("statusLine");
            const loadCodeBtn = document.getElementById("loadCodeBtn");
            const spawnBtn = document.getElementById("spawnBtn");
            const unspawnBtn = document.getElementById("unspawnBtn");

            function registerUpdate(updateFunction) {
                if (typeof updateFunction === "function") {
                    registeredUpdates.push(updateFunction);
                }
            }

            function disposeAllGenerators() {
                while (activeGenerators.length > 0) {
                    const generator = activeGenerators.pop();
                    if (generator && typeof generator.dispose === "function") {
                        generator.dispose();
                    }
                }
                registeredUpdates.length = 0;
            }

            function setStatus(message, isError = false) {
                statusLine.textContent = message;
                statusLine.style.color = isError ? "#ff9a9a" : "#90ee90";
            }

        // endregion -------------------------------------------------------------------


        // -----------------------------------------------------------------------------
        // REGION | Paste Zone Runtime Loader
        // -----------------------------------------------------------------------------

            function sanitizePastedModuleCode(rawCode) {
                if (!rawCode || !rawCode.trim()) return "";

                // Remove any top-level import lines so browser runtime parser accepts the code block.
                const withoutImports = rawCode.replace(/^\s*import\s+.*?;?\s*$/gm, "");

                // Convert "export function" to plain function declarations.
                const withoutExportFunctions = withoutImports.replace(/^\s*export\s+function\s+/gm, "function ");

                // Convert "export const" to plain const declarations (safe fallback).
                const withoutExportConsts = withoutExportFunctions.replace(/^\s*export\s+const\s+/gm, "const ");

                // Remove any "export default".
                const withoutExportDefault = withoutExportConsts.replace(/^\s*export\s+default\s+/gm, "");

                return withoutExportDefault;
            }

            function loadPastedCodeFromTextbox() {
                try {
                    const rawCode = codeInput.value;
                    const sanitizedCode = sanitizePastedModuleCode(rawCode);

                    if (!sanitizedCode.trim()) {
                        setStatus("Textbox is empty. Paste code first.", true);
                        return;
                    }

                    const loaderFactory = new Function(
                        "THREE",
                        `${sanitizedCode}
                        return {
                            Na__GenerateObject__CreateAnimatedBallCloud:
                                (typeof Na__GenerateObject__CreateAnimatedBallCloud === "function")
                                    ? Na__GenerateObject__CreateAnimatedBallCloud : null,
                            Na__GenerateObject__CreateAnimatedRGBBoxes:
                                (typeof Na__GenerateObject__CreateAnimatedRGBBoxes === "function")
                                    ? Na__GenerateObject__CreateAnimatedRGBBoxes : null,
                            Na__GenerateObject__CreateAnimatedWhiteStars:
                                (typeof Na__GenerateObject__CreateAnimatedWhiteStars === "function")
                                    ? Na__GenerateObject__CreateAnimatedWhiteStars : null
                        };`
                    );

                    const loaded = loaderFactory(THREE);

                    Na__GenerateObject__CreateAnimatedBallCloud = loaded.Na__GenerateObject__CreateAnimatedBallCloud;
                    Na__GenerateObject__CreateAnimatedRGBBoxes = loaded.Na__GenerateObject__CreateAnimatedRGBBoxes;
                    Na__GenerateObject__CreateAnimatedWhiteStars = loaded.Na__GenerateObject__CreateAnimatedWhiteStars;

                    const loadedNames = [];
                    if (Na__GenerateObject__CreateAnimatedBallCloud) loadedNames.push("BallCloud");
                    if (Na__GenerateObject__CreateAnimatedRGBBoxes) loadedNames.push("RGBBoxes");
                    if (Na__GenerateObject__CreateAnimatedWhiteStars) loadedNames.push("WhiteStars");

                    if (loadedNames.length === 0) {
                        setStatus("No matching generator function names found in pasted code.", true);
                        return;
                    }

                    setStatus(`Loaded: ${loadedNames.join(", ")}`);
                } catch (error) {
                    console.error(error);
                    setStatus(`Load error: ${error.message}`, true);
                }
            }

        // endregion -------------------------------------------------------------------


        // -----------------------------------------------------------------------------
        // REGION | Test Controls
        // -----------------------------------------------------------------------------

            function getLoadedGeneratorReference() {
                if (typeof Na__GenerateObject__CreateAnimatedBallCloud === "function") {
                    return {
                        name: "Ball Cloud",
                        createFunction: Na__GenerateObject__CreateAnimatedBallCloud
                    };
                }
                if (typeof Na__GenerateObject__CreateAnimatedRGBBoxes === "function") {
                    return {
                        name: "RGB Boxes",
                        createFunction: Na__GenerateObject__CreateAnimatedRGBBoxes
                    };
                }
                if (typeof Na__GenerateObject__CreateAnimatedWhiteStars === "function") {
                    return {
                        name: "White Stars",
                        createFunction: Na__GenerateObject__CreateAnimatedWhiteStars
                    };
                }
                return null;
            }

            function spawnLoadedGenerator() {
                disposeAllGenerators();

                const loadedGeneratorReference = getLoadedGeneratorReference();
                if (!loadedGeneratorReference) {
                    setStatus("No supported generator function loaded yet.", true);
                    return;
                }

                const generator = loadedGeneratorReference.createFunction(scene, {
                    count: 500,
                    size: 0.2,
                    diameter: 0.2,
                    boundsX: 5,
                    boundsY: 3,
                    boundsZ: 5,
                    centerY: 1,
                    speed: 0.05,
                    registerUpdate
                });
                activeGenerators.push(generator);
                setStatus(`Spawned ${loadedGeneratorReference.name}.`);
            }

            function unspawnLoadedGenerator() {
                disposeAllGenerators();
                setStatus("Unspawned active generator.");
            }

            window.addEventListener("keydown", (event) => {
                if (event.key.toLowerCase() === "s") spawnLoadedGenerator();
                if (event.key.toLowerCase() === "u") unspawnLoadedGenerator();
            });

            window.addEventListener("resize", () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            loadCodeBtn.addEventListener("click", loadPastedCodeFromTextbox);
            spawnBtn.addEventListener("click", spawnLoadedGenerator);
            unspawnBtn.addEventListener("click", unspawnLoadedGenerator);

        // endregion -------------------------------------------------------------------


        // -----------------------------------------------------------------------------
        // REGION | Animation Loop
        // -----------------------------------------------------------------------------

            function animate() {
                requestAnimationFrame(animate);

                for (let i = 0; i < registeredUpdates.length; i++) {
                    registeredUpdates[i]();
                }

                renderer.render(scene, camera);
            }

            animate();

        // endregion -------------------------------------------------------------------
    </script>
</body>
</html>
