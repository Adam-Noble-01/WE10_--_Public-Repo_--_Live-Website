    <!-- REGION | TrueVision 3D Application JavaScript Core               -->

    <script>
        (function () {
// -----------------------------------------------------------------------------
// REGION | Application Configuration and Global Constants
// -----------------------------------------------------------------------------

    // MODULE CONSTANTS | Geographical Coordinates and Site Information
    // ------------------------------------------------------------
    const GLOBAL_COORDINATES = {
        latitude                       : 52.9449,                            // <-- Nottingham, UK latitude coordinate
        longitude                      : -1.2245                             // <-- Nottingham, UK longitude coordinate
    };
    // ---------------------------------------------------------------

    // MODULE CONSTANTS | Site Orientation and Environmental Settings
    // ------------------------------------------------------------
    const PRINCIPAL_ELEVATION          = "West";                             // <-- Building principal elevation direction
    const GROUND_OFFSET                = -1.25;                              // <-- Ground plane offset in metres
    const CAMERA_OFFSET                = 10;                                 // <-- Additional camera positioning offset
    // ---------------------------------------------------------------

    // MODULE CONSTANTS | 3D Model Resource Configuration
    // ------------------------------------------------------------
    const MODEL_URL                    = "https://raw.githubusercontent.com/Adam-Noble-01/RE10_I_GitHub_I_Public_Repo/main/80_Test_Branch/True-Vision-3D_-_Test-01/True-Vision-3D_-_Test-Model_-_1.1.1.glb"; // <-- GLB model file URL
    // ---------------------------------------------------------------

    // MODULE CONSTANTS | Render Effect Configuration
    // ------------------------------------------------------------
    const ENABLE_SSAO_DEFAULT      = true;                                  // <-- Enable SSAO by default
    const SSAO_QUALITY_DEFAULT     = null;                                  // <-- Auto-detect quality setting
    // ---------------------------------------------------------------

// endregion -------------------------------------------------------------------

// -----------------------------------------------------------------------------
// REGION | Solar Position Calculation Utilities
// -----------------------------------------------------------------------------

    // HELPER FUNCTION | Calculate Sun Altitude Based on Time of Day
    // ---------------------------------------------------------------
    function computeSunAltitude(hour) {
        let altitudeDeg;                                                     // <-- Altitude angle in degrees
        
        if (hour <= 12) {                                                    // <-- Morning to noon calculation
            altitudeDeg = 20 + (hour - 9) * (60 - 20) / (12 - 9);          // <-- Linear interpolation morning
        } else {                                                             // <-- Afternoon calculation
            altitudeDeg = 60 - (hour - 12) * (60 - 30) / (15 - 12);        // <-- Linear interpolation afternoon
        }
        
        return altitudeDeg * (Math.PI / 180);                               // <-- Convert degrees to radians
    }
    // ---------------------------------------------------------------

    // HELPER FUNCTION | Calculate Sun Azimuth with Principal Elevation Offset
    // ---------------------------------------------------------------
    function computeSunAzimuth(hour) {
        let azimuthDeg;                                                      // <-- Azimuth angle in degrees
        
        if (hour <= 12) {                                                    // <-- Morning to noon calculation
            azimuthDeg = 110 + (hour - 9) * (180 - 110) / (12 - 9);        // <-- Linear interpolation morning
        } else {                                                             // <-- Afternoon calculation
            azimuthDeg = 180 + (hour - 12) * (250 - 180) / (15 - 12);      // <-- Linear interpolation afternoon
        }
        
        // CALCULATE PRINCIPAL ELEVATION OFFSET
        let offset = 0;                                                      // <-- Default offset for North orientation
        switch (PRINCIPAL_ELEVATION) {
            case "North":                                                    // <-- North facing building
                offset = 0;                                                  // <-- No offset required
                break;
            case "East":                                                     // <-- East facing building
                offset = 90;                                                 // <-- 90 degree offset
                break;
            case "South":                                                    // <-- South facing building
                offset = 180;                                                // <-- 180 degree offset
                break;
            case "West":                                                     // <-- West facing building
                offset = 270;                                                // <-- 270 degree offset
                break;
        }
        
        let adjustedAzimuth = (azimuthDeg + offset) % 360;                   // <-- Apply offset and normalize
        return adjustedAzimuth * (Math.PI / 180);                           // <-- Convert degrees to radians
    }
    // ---------------------------------------------------------------

// endregion -------------------------------------------------------------------

// -----------------------------------------------------------------------------
// REGION | Babylon.js Engine and Scene Initialization
// -----------------------------------------------------------------------------

    // MODULE VARIABLES | Core Babylon.js Engine and Scene Objects
    // ------------------------------------------------------------
    const canvas = document.getElementById("renderCanvas");                   // <-- HTML5 canvas element reference
    const engine = new BABYLON.Engine(canvas, true, { 
        preserveDrawingBuffer: true, 
        stencil: true 
    });                                                                      // <-- Babylon.js engine with enhanced options
    
    // DISABLE BABYLON.JS DEFAULT LOADING SCREEN
    engine.loadingScreen = {
        displayLoadingUI: function () { },                                   // <-- Empty display function
        hideLoadingUI: function () { }                                       // <-- Empty hide function
    };
    
    let scene, arcCamera, freeCamera, activeCamera, sunLight;               // <-- Core scene object references
    // ---------------------------------------------------------------

    // MODULE VARIABLES | DOM Element References for User Interface
    // ------------------------------------------------------------
    const loadingOverlay = document.getElementById("loading-overlay");       // <-- Loading overlay element
    const errorMessage = document.getElementById("error-message");           // <-- Error message display element
    const resetViewBtn = document.getElementById("resetViewBtn");            // <-- Reset view button reference
    const orbitModeBtn = document.getElementById("orbitModeBtn");            // <-- Orbit mode button reference
    const flyModeBtn = document.getElementById("flyModeBtn");                // <-- Fly mode button reference
    const sunTimeSlider = document.getElementById("sunTimeSlider");          // <-- Time slider control reference
    const sunTimeDisplay = document.getElementById("sunTimeDisplay");        // <-- Time display text reference
    const ssaoToggleBtn = document.getElementById("ssaoToggleBtn");          // <-- SSAO toggle button reference
    // ---------------------------------------------------------------

    // MODULE VARIABLES | Render Effects State
    // ------------------------------------------------------------
    let ssaoEnabled                = ENABLE_SSAO_DEFAULT;                    // <-- SSAO enabled state
    // ---------------------------------------------------------------

// endregion -------------------------------------------------------------------

// -----------------------------------------------------------------------------
// REGION | 3D Scene Creation and Configuration
// -----------------------------------------------------------------------------

    // FUNCTION | Create and Configure Complete 3D Scene Environment
    // ------------------------------------------------------------
    function createScene() {
        scene = new BABYLON.Scene(engine);                                   // <-- Initialize new Babylon.js scene
        
        // ENHANCE SCENE VISUAL QUALITY AND BRIGHTNESS
        scene.imageProcessingConfiguration.exposure = 1.5;                   // <-- Increase overall exposure
        scene.imageProcessingConfiguration.contrast = 1.2;                   // <-- Enhance contrast levels
        scene.imageProcessingConfiguration.toneMappingEnabled = true;        // <-- Enable tone mapping
        scene.clearColor = new BABYLON.Color4(0.94, 0.94, 0.94, 1);         // <-- Set light grey background
        
        createSceneLighting();                                               // <-- Configure sun and ambient lighting
        createSceneCameras();                                                // <-- Setup orbit and free cameras
        createSceneEnvironment();                                            // <-- Generate skybox and ground plane
        loadThreeDModel();                                                   // <-- Load and process 3D model
        initializeSunPosition();                                             // <-- Set initial sun position
        initializeRenderEffects();                                           // <-- Setup SSAO and other effects
        
        return scene;                                                        // <-- Return configured scene
    }
    // ---------------------------------------------------------------

    // SUB FUNCTION | Configure Scene Lighting System
    // ---------------------------------------------------------------
    function createSceneLighting() {
        // CREATE DIRECTIONAL LIGHT FOR SUN SIMULATION
        sunLight = new BABYLON.DirectionalLight("sunLight", 
            new BABYLON.Vector3(0, -1, 0), scene);                          // <-- Directional light pointing down
        sunLight.position = new BABYLON.Vector3(20, 40, 20);                // <-- Position in 3D space
        sunLight.intensity = 2.5;                                            // <-- Light intensity value
        
        // CREATE AMBIENT HEMISPHERIC LIGHT FOR FILL LIGHTING
        let hemiLight = new BABYLON.HemisphericLight("hemiLight", 
            new BABYLON.Vector3(0, 1, 0), scene);                           // <-- Hemispheric light pointing up
        hemiLight.intensity = 0.8;                                           // <-- Ambient light intensity
    }
    // ---------------------------------------------------------------

    // SUB FUNCTION | Initialize Camera Systems for Different View Modes
    // ---------------------------------------------------------------
    function createSceneCameras() {
        // CREATE ARC ROTATE CAMERA FOR ORBIT MODE
        arcCamera = new BABYLON.ArcRotateCamera("arcCamera", 
            BABYLON.Tools.ToRadians(45),                                     // <-- Initial alpha angle
            BABYLON.Tools.ToRadians(60),                                     // <-- Initial beta angle
            30,                                                              // <-- Initial radius distance
            BABYLON.Vector3.Zero(),                                          // <-- Target at origin
            scene);                                                          // <-- Scene reference
        arcCamera.attachControl(canvas, true);                               // <-- Enable user input controls
        arcCamera.lowerRadiusLimit = 3;                                      // <-- Minimum zoom distance
        arcCamera.upperRadiusLimit = 50;                                     // <-- Maximum zoom distance
        
        // CREATE FREE CAMERA FOR FLY-THROUGH MODE
        freeCamera = new BABYLON.FreeCamera("freeCamera", 
            new BABYLON.Vector3(10, 25, 90), scene);                        // <-- Initial camera position
        freeCamera.attachControl(canvas, true);                              // <-- Enable user input controls
        freeCamera.speed = 0.7;                                              // <-- Movement speed setting
        freeCamera.inertia = 0.1;                                            // <-- Inertia for smooth movement
        freeCamera.angularSensibility = 5000;                                // <-- Mouse sensitivity setting
        
        // SET DEFAULT ACTIVE CAMERA
        activeCamera = arcCamera;                                            // <-- Start with orbit camera
        scene.activeCamera = activeCamera;                                   // <-- Assign to scene
    }
    // ---------------------------------------------------------------

    // SUB FUNCTION | Create Default Environment with Skybox and Ground
    // ---------------------------------------------------------------
    function createSceneEnvironment() {
        // CONFIGURE ENVIRONMENT OPTIONS
        let envOptions = {
            createSkybox: true,                                              // <-- Enable skybox creation
            skyboxSize: 1000,                                                // <-- Skybox dimensions
            skyboxColor: new BABYLON.Color3(0.75, 0.85, 0.95),              // <-- Light blue sky color
            createGround: true,                                              // <-- Enable ground plane
            groundSize: 1000,                                                // <-- Ground plane dimensions
            groundColor: new BABYLON.Color3(0.85, 0.87, 0.85)               // <-- Light grey ground color
        };
        
        let env = scene.createDefaultEnvironment(envOptions);                // <-- Create environment
        
        // CONFIGURE GROUND PLANE PROPERTIES
        if (env.ground) {
            env.ground.position.y += GROUND_OFFSET;                          // <-- Apply ground offset
            env.ground.receiveShadows = true;                                // <-- Enable shadow reception
        }
        
        // SETUP SHADOW GENERATION SYSTEM
        let shadowGenerator = new BABYLON.ShadowGenerator(2048, sunLight);   // <-- Create shadow generator
        shadowGenerator.useExponentialShadowMap = true;                      // <-- Use exponential shadow mapping
        
        // STORE SHADOW GENERATOR FOR MODEL LOADING
        scene.shadowGenerator = shadowGenerator;                             // <-- Store reference for later use
        scene.environment = env;                                             // <-- Store environment reference
    }
    // ---------------------------------------------------------------

    // SUB FUNCTION | Load and Process 3D Model with Error Handling
    // ---------------------------------------------------------------
    function loadThreeDModel() {
        BABYLON.SceneLoader.Append("", MODEL_URL, scene, 
            function () {                                                    // <-- Success callback function
                loadingOverlay.classList.add("hidden");                     // <-- Hide loading overlay
                
                // ADD ALL MESHES TO SHADOW CASTING SYSTEM
                scene.meshes.forEach(function (mesh) {
                    if (mesh !== scene.environment.ground) {                 // <-- Exclude ground from shadows
                        scene.shadowGenerator.addShadowCaster(mesh, true);   // <-- Add mesh to shadow system
                    }
                });
                
                applyAutoMaterials();                                        // <-- Process and enhance materials
            }, 
            null,                                                            // <-- Progress callback (not used)
            function (scene, message, exception) {                           // <-- Error callback function
                console.error("Error loading model:", message, exception);   // <-- Log error details
                loadingOverlay.classList.add("hidden");                     // <-- Hide loading overlay
                errorMessage.style.display = "block";                       // <-- Show error message
            }
        );
    }
    // ---------------------------------------------------------------

    // SUB FUNCTION | Initialize Sun Position Using Default Slider Value
    // ---------------------------------------------------------------
    function initializeSunPosition() {
        updateSunPosition(parseFloat(sunTimeSlider.value));                  // <-- Set initial sun position
    }
    // ---------------------------------------------------------------

// endregion -------------------------------------------------------------------

// -----------------------------------------------------------------------------
// REGION | Material Processing and Enhancement System
// -----------------------------------------------------------------------------

    // FUNCTION | Automatically Detect and Enhance Material Properties
    // ------------------------------------------------------------
    function applyAutoMaterials() {
        scene.materials.forEach(function (mat) {                             // <-- Iterate through all materials
            let name = mat.name.toLowerCase();                               // <-- Get lowercase material name
            
            // APPLY GENERAL PBR MATERIAL ENHANCEMENTS
            if (mat instanceof BABYLON.PBRMaterial) {
                mat.backFaceCulling = false;                                 // <-- Disable backface culling
            }
            
            // DETECT AND ENHANCE GLASS MATERIALS
            if (name.indexOf("glass") !== -1) {                             // <-- Check for glass in name
                if (mat instanceof BABYLON.PBRMaterial) {
                    mat.alpha = 0.5;                                         // <-- Set transparency level
                    mat.transparencyMode = BABYLON.PBRMaterial.PBRMATERIAL_ALPHABLEND; // <-- Enable alpha blending
                    mat.reflectivityColor = new BABYLON.Color3(0.9, 0.9, 0.9); // <-- High reflectivity
                    mat.albedoColor = new BABYLON.Color3(0.8, 0.8, 0.9);    // <-- Slight blue tint
                }
            }
            // DETECT AND ENHANCE METAL MATERIALS
            else if (name.indexOf("metal") !== -1) {                        // <-- Check for metal in name
                if (mat instanceof BABYLON.PBRMaterial) {
                    mat.metallic = 1.0;                                      // <-- Full metallic property
                    mat.roughness = 0.2;                                     // <-- Low roughness for shine
                }
            }
        });
    }
    // ---------------------------------------------------------------

// endregion -------------------------------------------------------------------

// -----------------------------------------------------------------------------
// REGION | Dynamic Sun Position and Lighting Updates
// -----------------------------------------------------------------------------

    // FUNCTION | Update Sun Light Direction Based on Time Selection
    // ------------------------------------------------------------
    function updateSunPosition(selectedHour) {
        const altitude = computeSunAltitude(selectedHour);                   // <-- Calculate sun altitude angle
        const azimuth = computeSunAzimuth(selectedHour);                     // <-- Calculate sun azimuth angle
        
        // CONVERT SPHERICAL COORDINATES TO CARTESIAN DIRECTION VECTOR
        const x = Math.cos(altitude) * Math.sin(azimuth);                    // <-- X component calculation
        const y = Math.sin(altitude);                                        // <-- Y component calculation
        const z = Math.cos(altitude) * Math.cos(azimuth);                    // <-- Z component calculation
        
        sunLight.direction = new BABYLON.Vector3(-x, -y, -z);                // <-- Set light direction vector
    }
    // ---------------------------------------------------------------

// endregion -------------------------------------------------------------------

// -----------------------------------------------------------------------------
// REGION | Render Effects Initialization and Management
// -----------------------------------------------------------------------------

    // FUNCTION | Initialize Post-Processing Render Effects
    // ------------------------------------------------------------
    function initializeRenderEffects() {
        // INITIALIZE SSAO AMBIENT OCCLUSION EFFECT
        if (ssaoEnabled && window.TrueVision3D && window.TrueVision3D.RenderEffects) {
            const ssaoEffect = window.TrueVision3D.RenderEffects.SsaoAmbientOcclusionEffect;
            if (ssaoEffect) {
                const initialized = ssaoEffect.initialize(scene, activeCamera, SSAO_QUALITY_DEFAULT);
                if (initialized) {
                    console.log("SSAO effect initialized successfully");     // <-- Log success
                    updateSSAOButtonState();                                 // <-- Update UI button
                } else {
                    console.warn("SSAO effect failed to initialize");       // <-- Log failure
                    ssaoEnabled = false;                                     // <-- Disable if failed
                }
            }
        }
    }
    // ---------------------------------------------------------------

    // SUB FUNCTION | Toggle SSAO Effect On/Off
    // ---------------------------------------------------------------
    function toggleSSAO() {
        const ssaoEffect = window.TrueVision3D?.RenderEffects?.SsaoAmbientOcclusionEffect;
        if (!ssaoEffect) return;                                             // <-- Exit if not available
        
        ssaoEnabled = !ssaoEnabled;                                          // <-- Toggle state
        ssaoEffect.setEnabled(ssaoEnabled);                                  // <-- Apply state change
        updateSSAOButtonState();                                             // <-- Update UI
        
        console.log("SSAO " + (ssaoEnabled ? "enabled" : "disabled"));      // <-- Log state change
    }
    // ---------------------------------------------------------------

    // SUB FUNCTION | Update SSAO Button Visual State
    // ---------------------------------------------------------------
    function updateSSAOButtonState() {
        if (ssaoToggleBtn) {
            ssaoToggleBtn.textContent = ssaoEnabled ? "SSAO: ON" : "SSAO: OFF"; // <-- Update button text
            ssaoToggleBtn.style.backgroundColor = ssaoEnabled ? "#4CAF50" : "#666"; // <-- Update button color
        }
    }
    // ---------------------------------------------------------------

    // SUB FUNCTION | Handle Camera Switch for SSAO Update
    // ---------------------------------------------------------------
    function updateSSAOCamera() {
        const ssaoEffect = window.TrueVision3D?.RenderEffects?.SsaoAmbientOcclusionEffect;
        if (!ssaoEffect || !ssaoEnabled) return;                            // <-- Exit if not needed
        
        // RE-INITIALIZE SSAO WITH NEW CAMERA
        ssaoEffect.dispose();                                                // <-- Clean up old pipeline
        ssaoEffect.initialize(scene, activeCamera);                         // <-- Create with new camera
    }
    // ---------------------------------------------------------------

// endregion -------------------------------------------------------------------

// -----------------------------------------------------------------------------
// REGION | Camera Control and View Management Functions
// -----------------------------------------------------------------------------

    // FUNCTION | Reset Camera to Default Position Based on Active Mode
    // ------------------------------------------------------------
    function resetView() {
        if (activeCamera === arcCamera) {                                    // <-- Check if orbit camera active
            arcCamera.setPosition(new BABYLON.Vector3(0, 10, -30 - CAMERA_OFFSET)); // <-- Set orbit position
            arcCamera.setTarget(BABYLON.Vector3.Zero());                     // <-- Target scene center
        } else if (activeCamera === freeCamera) {                           // <-- Check if free camera active
            freeCamera.position = new BABYLON.Vector3(5, 2, 18 - CAMERA_OFFSET); // <-- Set free camera position
            freeCamera.setTarget(BABYLON.Vector3.Zero());                    // <-- Target scene center
        }
    }
    // ---------------------------------------------------------------

    // SUB FUNCTION | Switch to Orbit Camera Mode
    // ---------------------------------------------------------------
    function switchToOrbitMode() {
        if (activeCamera !== arcCamera) {                                    // <-- Check if not already orbit mode
            activeCamera.detachControl(canvas);                              // <-- Detach current camera controls
            activeCamera = arcCamera;                                        // <-- Set orbit camera as active
            scene.activeCamera = activeCamera;                               // <-- Update scene active camera
            activeCamera.attachControl(canvas, true);                        // <-- Attach orbit camera controls
            resetView();                                                     // <-- Reset to default view
            updateSSAOCamera();                                              // <-- Update SSAO for new camera
        }
    }
    // ---------------------------------------------------------------

    // SUB FUNCTION | Switch to Fly-Through Camera Mode
    // ---------------------------------------------------------------
    function switchToFlyMode() {
        if (activeCamera !== freeCamera) {                                   // <-- Check if not already fly mode
            activeCamera.detachControl(canvas);                              // <-- Detach current camera controls
            activeCamera = freeCamera;                                       // <-- Set free camera as active
            scene.activeCamera = activeCamera;                               // <-- Update scene active camera
            activeCamera.attachControl(canvas, true);                        // <-- Attach free camera controls
            resetView();                                                     // <-- Reset to default view
            updateSSAOCamera();                                              // <-- Update SSAO for new camera
        }
    }
    // ---------------------------------------------------------------

// endregion -------------------------------------------------------------------

// -----------------------------------------------------------------------------
// REGION | User Interface Event Handling and Time Display
// -----------------------------------------------------------------------------

    // FUNCTION | Process Sun Time Slider Input and Update Display
    // ------------------------------------------------------------
    function handleSunTimeChange() {
        const selectedHour = parseFloat(sunTimeSlider.value);                // <-- Get slider value as number
        const displayHour = Math.floor(selectedHour);                       // <-- Extract whole hour portion
        const displayMinutes = Math.round((selectedHour - displayHour) * 60); // <-- Calculate minutes from decimal
        
        // FORMAT TIME STRING WITH LEADING ZEROS
        const timeString = displayHour.toString().padStart(2, '0') + ":" + 
                          displayMinutes.toString().padStart(2, '0');       // <-- Format as HH:MM
        
        sunTimeDisplay.textContent = timeString;                             // <-- Update display text
        updateSunPosition(selectedHour);                                     // <-- Update sun light position
    }
    // ---------------------------------------------------------------

// endregion -------------------------------------------------------------------

// -----------------------------------------------------------------------------
// REGION | Application Initialization and Event Listener Registration
// -----------------------------------------------------------------------------

    // FUNCTION | Initialize Complete 3D Application
    // ------------------------------------------------------------
    function initializeApplication() {
        scene = createScene();                                               // <-- Create and configure scene
        
        // START CONTINUOUS RENDER LOOP
        engine.runRenderLoop(function () {
            if (scene) {                                                     // <-- Check scene exists
                scene.render();                                              // <-- Render frame
            }
        });
        
        // HANDLE WINDOW RESIZE EVENTS
        window.addEventListener("resize", function () {
            engine.resize();                                                 // <-- Resize engine to match window
        });
        
        registerEventHandlers();                                             // <-- Setup user interface events
    }
    // ---------------------------------------------------------------

    // SUB FUNCTION | Register All User Interface Event Handlers
    // ---------------------------------------------------------------
    function registerEventHandlers() {
        // CAMERA CONTROL BUTTON EVENTS
        resetViewBtn.addEventListener("click", resetView);                   // <-- Reset view button handler
        orbitModeBtn.addEventListener("click", switchToOrbitMode);           // <-- Orbit mode button handler  
        flyModeBtn.addEventListener("click", switchToFlyMode);               // <-- Fly mode button handler
        
        // RENDER EFFECT BUTTON EVENTS
        ssaoToggleBtn.addEventListener("click", toggleSSAO);                 // <-- SSAO toggle button handler
        
        // SUN TIME SLIDER EVENTS
        sunTimeSlider.addEventListener("input", handleSunTimeChange);        // <-- Time slider change handler
    }
    // ---------------------------------------------------------------

    // SUB FUNCTION | Cleanup Resources on Page Unload
    // ---------------------------------------------------------------
    function cleanupResources() {
        const ssaoEffect = window.TrueVision3D?.RenderEffects?.SsaoAmbientOcclusionEffect;
        if (ssaoEffect) {
            ssaoEffect.dispose();                                            // <-- Clean up SSAO resources
        }
        
        if (engine) {
            engine.dispose();                                                // <-- Clean up Babylon engine
        }
    }
    // ---------------------------------------------------------------

    // REGISTER CLEANUP ON PAGE UNLOAD
    window.addEventListener("beforeunload", cleanupResources);               // <-- Ensure proper cleanup

// endregion -------------------------------------------------------------------

// -----------------------------------------------------------------------------
// REGION | Application Startup Execution
// -----------------------------------------------------------------------------

    // INITIALIZE APPLICATION ON SCRIPT LOAD
    initializeApplication();                                                 // <-- Start application immediately

// endregion -------------------------------------------------------------------

        })();
    </script>
    <!-- endregion ----------------------------------------------------------------- -->
