<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting to Project Vision...</title>

    <!-- ----------------------------------------------------------------- -->
    <!-- REGION  |  BRANDING | Favicon                                     -->
    <!-- ----------------------------------------------------------------- -->

    <link rel="icon" type="image/svg+xml" href="https://www.noble-architecture.com/na-apps/01__Assets__NaApps__CommonAssets/NaApps__CommonIcons/CommonIcon__NaLogoFavicon__SVG-h50mm.svg">

    <!-- endregion -------------------------------------------------------- -->

    <style>
        @font-face {
            font-family   :  'Open Sans';
            font-style    :  normal;
            font-weight   :  400;
            src           :  url('https://www.noble-architecture.com/na-apps/01__Assets__NaApps__CommonAssets/NaApps__CommonFonts/CommonFont-01__OpenSans__Regular__.ttf') format('truetype');
            font-display  :  swap;
        }

        body {
            font-family      :  'Open Sans', Arial, sans-serif;
            background-color :  #f8f7f5;
            display          :  flex;
            justify-content  :  center;
            align-items      :  center;
            min-height       :  100vh;
            margin           :  0;
            color            :  #555041;
        }

        .redirect-message {
            text-align    :  center;
            padding       :  40px;
            background    :  white;
            border        :  2px solid #555041;
            border-radius :  8px;
            max-width     :  500px;
        }

        .redirect-message h1 {
            color          :  #555041;
            margin-bottom  :  20px;
            font-size      :  22px;
        }

        .redirect-message p {
            margin-bottom  :  20px;
            line-height    :  1.6;
        }

            color            :  #555041;
            text-decoration  :  underline;
        }
    </style>
</head>
<body>
    <div class="redirect-message">
        <h1>Redirecting to Project Vision...</h1>
        <p>You are being redirected to the Project Hub.</p>
        <p>If you are not redirected automatically, <a id="fallbackLink" href="05__ProjectVision__CoreAppCode/index.html">click here</a>.</p>
    </div>

    <script>
        (function() {
            var targetBase = '05__ProjectVision__CoreAppCode/index.html';
            var search     = window.location.search;

            var targetUrl = search ? targetBase + search : targetBase;

            document.getElementById('fallbackLink').href = targetUrl;

            window.location.href = targetUrl;
        })();
    </script>
